<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デュエルマスターズシミュレーター</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&display=swap');
:root{--nat:#22cc55;--drk:#aa44ff;--mul:#cc2288;--bg:#06060f;--panel:#0e0e1c;--bdr:#1e1a30;--txt:#eeeeff;--muted:#6a5e88;--gold:#ffcc00;--gold2:#ffaa00;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans JP',sans-serif;height:100vh;overflow:hidden;}

/* ── 画面管理 ── */
#scr-title,#scr-coin,#scr-game{position:fixed;inset:0;display:none;flex-direction:column;}
#scr-title.on,#scr-coin.on,#scr-game.on{display:flex;}

/* ── タイトルボタン行 ── */
.t-btn-row{display:flex;gap:10px;margin:8px 0;}
.t-sub-btn{padding:8px 18px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:rgba(255,255,255,.75);font-size:.68rem;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all .15s;}
.t-sub-btn:hover{background:rgba(255,204,0,.15);border-color:var(--gold);color:var(--gold);}
#t-deck-display{cursor:pointer;transition:all .15s;}
#t-deck-display:hover{border-color:var(--gold);}

/* ── 共通モーダルベース ── */
#card-list-modal,#deck-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:800;align-items:center;justify-content:center;}
#card-list-modal.open,#deck-modal.open{display:flex;}
#clm-inner,#dm-inner{background:#0a0a1a;border:1px solid var(--gold);border-radius:12px;padding:16px;max-width:440px;width:96%;max-height:88vh;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 32px rgba(255,204,0,.2);animation:mdIn .18s ease;overflow:hidden;}
.modal-title{font-size:.82rem;font-weight:900;color:var(--gold);letter-spacing:.06em;flex-shrink:0;}
.modal-close-btn{padding:6px 18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.2);border-radius:18px;color:rgba(255,255,255,.5);font-size:.62rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif;align-self:center;flex-shrink:0;}
.modal-close-btn:hover{border-color:var(--gold);color:var(--gold);}

/* ── カード一覧 ── */
#clm-list{flex:1;overflow-y:auto;display:flex;flex-wrap:wrap;gap:6px;padding:4px;}
#clm-list::-webkit-scrollbar{width:3px;}
#clm-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);}
.clm-card{width:58px;height:80px;border-radius:5px;border:1px solid rgba(255,255,255,.15);overflow:hidden;cursor:pointer;flex-shrink:0;transition:transform .15s;position:relative;}
.clm-card:hover{transform:scale(1.1);z-index:2;}
.clm-card img{width:100%;height:100%;object-fit:cover;display:block;}
.clm-card-icon{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1rem;background:#10071e;}
.clm-card-name{position:absolute;bottom:0;left:0;right:0;font-size:.32rem;background:rgba(0,0,0,.8);color:#eee;padding:1px 2px;text-align:center;line-height:1.3;}

/* ── デッキ管理 ── */
#dm-saved-list{display:flex;flex-direction:column;gap:4px;flex-shrink:0;max-height:120px;overflow-y:auto;}
#dm-saved-list::-webkit-scrollbar{width:3px;}
.dm-saved-item{display:flex;align-items:center;gap:6px;padding:6px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:6px;}
.dm-saved-name{flex:1;font-size:.65rem;color:#eee;}
.dm-saved-count{font-size:.56rem;color:rgba(255,255,255,.4);}
.dm-load-btn{padding:3px 8px;border-radius:5px;border:1px solid var(--gold);color:var(--gold);background:rgba(255,204,0,.08);font-size:.55rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.dm-load-btn:hover{background:rgba(255,204,0,.2);}
.dm-del-btn{padding:3px 6px;border-radius:5px;border:1px solid rgba(255,80,80,.4);color:rgba(255,120,120,.8);background:rgba(255,60,60,.06);font-size:.55rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.dm-del-btn:hover{background:rgba(255,60,60,.2);}
#dm-editor{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;border-top:1px solid rgba(255,255,255,.08);padding-top:8px;}
#dm-editor-header{display:flex;gap:6px;flex-shrink:0;}
#dm-deck-name{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);border-radius:6px;color:#eee;font-size:.65rem;padding:6px 10px;font-family:'Noto Sans JP',sans-serif;}
#dm-editor-header button{padding:6px 12px;background:rgba(255,204,0,.1);border:1px solid var(--gold);border-radius:6px;color:var(--gold);font-size:.62rem;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;}
#dm-editor-header button:hover{background:rgba(255,204,0,.25);}
#dm-editor-cards{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;}
#dm-editor-cards::-webkit-scrollbar{width:3px;}
#dm-editor-cards::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);}
.dm-card-row{display:flex;align-items:center;gap:8px;padding:4px 6px;background:rgba(255,255,255,.03);border-radius:5px;border:1px solid rgba(255,255,255,.07);}
.dm-card-img{width:28px;height:38px;object-fit:cover;border-radius:3px;flex-shrink:0;}
.dm-card-icon{width:28px;height:38px;display:flex;align-items:center;justify-content:center;font-size:.7rem;background:#10071e;border-radius:3px;flex-shrink:0;}
.dm-card-info{flex:1;min-width:0;}
.dm-card-n{font-size:.6rem;font-weight:700;color:#eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dm-card-c{font-size:.5rem;color:rgba(255,255,255,.35);}
.dm-qty{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.dm-qty button{width:22px;height:22px;border-radius:4px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#eee;font-size:.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.dm-qty button:hover{background:rgba(255,204,0,.2);border-color:var(--gold);}
.dm-qty-val{font-size:.65rem;font-weight:700;color:var(--gold);min-width:14px;text-align:center;}
#scr-title{align-items:center;justify-content:center;background:radial-gradient(ellipse 100% 80% at 50% 50%,#120828,var(--bg));overflow:hidden;}
#scr-title::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 20% 80%,rgba(34,204,85,.12),transparent 60%),radial-gradient(ellipse 60% 40% at 80% 20%,rgba(170,68,255,.12),transparent 60%);}
.t-logo{position:relative;z-index:1;text-align:center;margin-bottom:28px;}
.t-sub{font-size:.7rem;letter-spacing:.3em;color:var(--muted);margin-bottom:8px;}
.t-main{font-family:'Kaisei Decol',serif;font-size:2.2rem;font-weight:700;letter-spacing:.1em;background:linear-gradient(135deg,#ffcc00,#ff8800 40%,#22cc55 70%,#aa44ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 16px rgba(255,170,0,.35));line-height:1.25;margin-bottom:4px;}
.t-en{font-size:.7rem;letter-spacing:.2em;color:var(--muted);}
.t-deck{position:relative;z-index:1;text-align:center;margin-bottom:28px;}
.t-deck-icons{font-size:1.6rem;margin-bottom:8px;}
.t-deck-badge{display:inline-block;font-size:.82rem;font-weight:700;color:var(--nat);border:1px solid rgba(34,204,85,.4);background:rgba(34,204,85,.08);border-radius:20px;padding:5px 18px;}
.t-start{position:relative;z-index:1;padding:13px 44px;border-radius:50px;border:2px solid var(--gold);font-family:'Kaisei Decol',serif;font-size:1.05rem;font-weight:700;letter-spacing:.15em;color:#000;background:linear-gradient(135deg,var(--gold2),var(--gold));cursor:pointer;transition:all .2s;box-shadow:0 0 24px rgba(255,204,0,.25),0 4px 12px rgba(0,0,0,.5);}
.t-start:hover{transform:scale(1.05) translateY(-2px);box-shadow:0 0 40px rgba(255,204,0,.45);}
.t-test{position:fixed;bottom:20px;right:20px;z-index:2;padding:8px 18px;border-radius:20px;border:1px solid #666;background:rgba(255,255,255,.06);color:#aaa;font-size:.68rem;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:all .18s;letter-spacing:.05em;}
.t-test:hover{border-color:#ff9900;color:#ff9900;background:rgba(255,153,0,.1);}
/* バージョンバッジ */
#ver-badge{position:fixed;bottom:14px;left:16px;z-index:10;padding:5px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.35);font-size:.58rem;letter-spacing:.05em;cursor:pointer;transition:all .18s;font-family:'Noto Sans JP',sans-serif;}
#ver-badge:hover{border-color:rgba(255,204,0,.4);color:rgba(255,204,0,.8);background:rgba(255,204,0,.06);}
/* バージョンモーダル */
#ver-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:800;align-items:center;justify-content:center;}
#ver-modal.open{display:flex;}
#ver-modal-inner{background:#0a0a1a;border:1px solid var(--gold);border-radius:12px;padding:18px;max-width:380px;width:92%;max-height:80vh;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 32px rgba(255,204,0,.2);animation:mdIn .18s ease;overflow:hidden;}
#ver-modal-inner h2{font-size:.8rem;font-weight:900;color:var(--gold);letter-spacing:.06em;flex-shrink:0;}
#ver-modal-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
#ver-modal-list::-webkit-scrollbar{width:3px;}
#ver-modal-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);}
.vm-header{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
.vm-ver{font-size:.72rem;font-weight:900;color:var(--gold);}
.vm-date{font-size:.54rem;color:rgba(255,255,255,.35);}
.vm-logs{display:flex;flex-direction:column;gap:3px;}
.vm-log{font-size:.56rem;color:rgba(255,255,255,.6);border-left:2px solid rgba(255,255,255,.15);padding:2px 0 2px 8px;line-height:1.55;}
.vm-log.fix{border-color:#ff7755;color:rgba(255,200,180,.75);}
.vm-log.add{border-color:#55cc88;color:rgba(180,255,200,.75);}
.vm-log.chg{border-color:#88aaff;color:rgba(180,200,255,.75);}
.vm-sep{height:1px;background:rgba(255,255,255,.07);margin:4px 0;}
/* テストモード中のバッジ */
#test-badge{display:none;position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:999;background:#ff6600;color:#fff;font-size:.6rem;font-weight:900;padding:3px 14px;border-radius:20px;letter-spacing:.08em;pointer-events:none;}
#test-badge.on{display:block;}

/* ── コイン ── */
#scr-coin{align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.96);}
.c-head{font-family:'Kaisei Decol',serif;font-size:1.2rem;color:var(--gold);text-shadow:0 0 18px rgba(255,204,0,.5);}
#c-icon{font-size:3.5rem;}
.c-spin{animation:cSpin .45s ease-in-out infinite;}
@keyframes cSpin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.1)}}
#c-result{font-family:'Kaisei Decol',serif;font-size:1.8rem;font-weight:700;min-height:2.4rem;}
#c-sub{font-size:.8rem;color:var(--muted);text-align:center;line-height:1.8;min-height:3rem;}
#c-go{padding:10px 30px;border-radius:8px;border:1px solid var(--gold);color:var(--gold);background:rgba(255,204,0,.1);font-family:'Noto Sans JP',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;display:none;}
#c-go:hover{background:rgba(255,204,0,.25);}

/* ── ゲーム ── */
#scr-game{flex-direction:column;overflow:visible;background:radial-gradient(ellipse 120% 100% at 50% 60%,#1a3a1a 0%,#0d200d 40%,#060e06 100%);}
#g-header{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.55);flex-shrink:0;gap:8px;height:36px;}
#g-home-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:6px;color:#aaa;font-size:.72rem;padding:2px 7px;cursor:pointer;transition:all .15s;}
#g-home-btn:hover{border-color:var(--gold);color:var(--gold);}
#g-header h1{font-family:'Kaisei Decol',serif;font-size:.82rem;color:var(--gold);text-shadow:0 0 10px rgba(255,204,0,.4);letter-spacing:.08em;flex:1;text-align:center;}
.g-hright{display:flex;align-items:center;gap:8px;}
.g-turn{font-size:.65rem;color:rgba(255,255,255,.5);}
.g-turn span{color:var(--gold);font-weight:700;}
.g-fbadge{font-size:.56rem;font-weight:700;padding:2px 7px;border-radius:10px;border:1px solid;}
.fb-you{border-color:#ee7766;color:#ee7766;}
.fb-opp{border-color:#aa77ee;color:#aa77ee;}
#zm-actions{display:flex;flex-direction:column;gap:4px;}

/* ── ボードレイアウト ── */
#g-board{display:flex;flex:1;min-height:0;overflow:hidden;}
#g-field{display:flex;flex-direction:column;flex:1;min-height:0;}
.field-row{display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.row-ohand{height:30px;padding:1px 4px;}
.row-mana{height:52px;gap:3px;overflow:visible;padding:2px 4px;}
.row-oshield{height:52px;gap:4px;padding:2px 4px;}
.row-bzone{flex:1;min-height:0;overflow:visible;padding:2px 4px;}
.row-mshield{height:52px;gap:4px;padding:2px 4px;}
#g-hand{flex-shrink:0;height:150px;background:linear-gradient(0deg,rgba(0,0,0,.92),rgba(0,0,0,.5));border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;padding:0 8px 4px;overflow:visible;position:relative;z-index:10;}
.mzone{flex-shrink:0;display:flex;flex-wrap:wrap;justify-content:center;gap:3px;padding:2px;}
.mc{width:36px;height:50px;border-radius:5px;border:1.5px solid;overflow:hidden;position:relative;transition:transform .18s,opacity .18s;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.5);}
.row-mana{height:60px;gap:3px;overflow:visible;padding:2px 4px;}
#g-centerline{display:flex;align-items:center;gap:4px;padding:0 4px;flex-shrink:0;height:22px;}

/* ── 相手手札（右上・扇状） ── */
#ohand-area{position:fixed;top:44px;right:8px;z-index:5;pointer-events:none;}
#ohand-badge{background:rgba(0,0,0,.75);border:1px solid rgba(170,119,238,.5);border-radius:8px;padding:5px 10px;color:rgba(200,170,255,.9);font-size:.62rem;font-weight:700;text-align:center;line-height:1.5;}
#ohand{display:flex;align-items:flex-start;justify-content:flex-end;}


/* ── マナゾーン（カード画像） ── */
.mc img{width:100%;height:100%;object-fit:cover;border-radius:2px;display:block;}
.mc.mn{border-color:var(--nat);}
.mc.md{border-color:var(--drk);}
.mc.mm{border-color:var(--mul);}
.mc.mnd{border-color:#557766;}
.mc.mt{transform:rotate(90deg);opacity:.65;}
.mc-tap-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);border-radius:2px;}
.phase-label{font-size:.6rem;font-weight:700;color:rgba(255,255,255,.75);letter-spacing:.06em;white-space:nowrap;text-align:center;min-width:60px;}
.grave-btn{padding:4px 7px;border-radius:6px;border:1px solid rgba(255,100,100,.4);background:rgba(255,80,80,.08);color:rgba(255,150,150,.8);font-size:.65rem;cursor:pointer;flex-shrink:0;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:1px;margin-left:8px;}
.grave-btn span{font-size:.58rem;font-weight:700;color:rgba(255,180,180,.9);}
.grave-btn:hover{background:rgba(255,80,80,.2);border-color:rgba(255,120,120,.7);}

/* ターン終了ボタン（センターライン内） */
#btn-end-turn{padding:3px 10px;border-radius:10px;border:2px solid #cc7700;background:linear-gradient(180deg,#c85e00,#7a3000);color:#fff;font-size:.58rem;font-weight:900;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:all .18s;box-shadow:0 2px 8px rgba(0,0,0,.5);flex-shrink:0;}
#btn-end-turn:hover{background:linear-gradient(180deg,#e06a00,#8a3800);box-shadow:0 3px 12px rgba(200,100,0,.4);}
#btn-end-turn.opp-turn{background:linear-gradient(180deg,#252525,#151515);border-color:#333;color:#444;cursor:not-allowed;}
.field-row{display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.field-lbl{font-size:.44rem;color:rgba(255,255,255,.4);margin-left:6px;white-space:nowrap;}

.bzone{width:100%;height:100%;border:1px dashed;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:nowrap;padding:4px;box-sizing:border-box;overflow:visible;}
.bz-y{border-color:rgba(255,200,100,.25);background:rgba(255,180,50,.04);}
.bz-o{border-color:rgba(150,100,255,.25);background:rgba(130,80,255,.04);}
.bzone:empty::before{content:attr(data-empty);color:rgba(255,255,255,.18);font-size:.55rem;}
.bzone .card{width:58px;height:80px;flex-shrink:1;}

.divr{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);}
.pbtn{padding:3px 12px;border-radius:14px;font-size:.58rem;font-weight:700;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.7);background:rgba(255,255,255,.07);cursor:pointer;transition:all .2s;white-space:nowrap;font-family:'Noto Sans JP',sans-serif;}
.pbtn:hover{background:rgba(255,255,255,.15);border-color:var(--gold);color:var(--gold);}

.mn{background:rgba(34,204,85,.25);border-color:var(--nat);color:#77ee99;}
.md{background:rgba(170,68,255,.25);border-color:var(--drk);color:#cc88ff;}
.mm{background:rgba(204,34,136,.25);border-color:var(--mul);color:#ff77cc;}
.mnd{background:linear-gradient(to right,rgba(34,204,85,.4) 50%,rgba(170,68,255,.4) 50%);border-color:#557766;color:#aaffcc;font-size:.34rem !important;}
.mt{transform:rotate(18deg);opacity:.35;}

/* ── サイドバー ── */
#g-sidebar{display:flex;flex-direction:column;border-left:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.5);overflow:hidden;gap:2px;}

/* ── ターン終了ボタン（HS風） ── */
#btn-end-turn{margin:8px 8px 2px;padding:0;height:64px;border-radius:12px;border:2px solid #cc7700;background:linear-gradient(180deg,#c85e00 0%,#7a3000 100%);color:#fff;font-size:.7rem;font-weight:900;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(0,0,0,.6),inset 0 1px rgba(255,255,255,.2),0 0 0 1px rgba(200,100,0,.3);letter-spacing:.05em;text-shadow:0 1px 3px rgba(0,0,0,.9);line-height:1.4;flex-shrink:0;}
#btn-end-turn:hover:not(.opp-turn){background:linear-gradient(180deg,#e06a00 0%,#8a3800 100%);transform:translateY(-2px);box-shadow:0 6px 18px rgba(200,100,0,.5),inset 0 1px rgba(255,255,255,.25);border-color:#ee9900;}
#btn-end-turn.opp-turn{background:linear-gradient(180deg,#252525,#151515);border-color:#333;color:#444;cursor:not-allowed;box-shadow:none;transform:none;}

/* ── アクションボタン ── */
#g-acts{display:flex;flex-direction:column;gap:3px;padding:3px 5px;}
#g-selinfo{font-size:.46rem;color:rgba(255,255,255,.3);text-align:center;padding:1px 0;min-height:11px;}
.abtn{width:100%;padding:5px 4px;border-radius:6px;border:1px solid;font-size:.58rem;font-weight:700;cursor:pointer;transition:all .16s;font-family:'Noto Sans JP',sans-serif;}
.abtn:disabled{opacity:.2;cursor:not-allowed;}
.a-sum{border-color:#55cc55;color:#88ff88;background:rgba(85,204,85,.1);}
.a-sum:not(:disabled):hover{background:rgba(85,204,85,.22);}
.a-mna{border-color:var(--nat);color:#77ee99;background:rgba(34,204,85,.08);}
.a-mna:not(:disabled):hover{background:rgba(34,204,85,.2);}
.a-atk{border-color:#dd6622;color:#ffaa66;background:rgba(221,102,34,.1);}
.a-atk:not(:disabled):hover{background:rgba(221,102,34,.22);}

/* ── ログ ── */
#g-log{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
#log-toggle{width:100%;padding:4px 6px;background:rgba(255,204,0,.05);border:none;border-top:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);color:var(--gold);font-size:.56rem;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;text-align:left;}
#log-toggle:hover{background:rgba(255,204,0,.12);}
.log-badge{display:inline-block;background:#ff4422;color:#fff;border-radius:8px;padding:0 4px;font-size:.48rem;font-weight:900;margin-left:3px;vertical-align:middle;}
#g-loginner{flex:1;overflow-y:auto;padding:3px;display:none;}
#g-loginner::-webkit-scrollbar{width:2px;}
#g-loginner::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);}
.log-open #g-loginner{display:block;}
.log-closed #g-loginner{display:none;}
.logtitle{font-size:.5rem;letter-spacing:.1em;color:rgba(255,255,255,.3);text-align:center;margin-bottom:2px;}
.le{font-size:.54rem;padding:2px 3px;margin-bottom:1px;border-radius:3px;border-left:2px solid;line-height:1.4;}
.ls{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.4);}
.la{border-color:#ff4422;color:#ff9988;background:rgba(255,68,34,.04);}

/* ── カード基本 ── */
.card{width:52px;height:72px;border-radius:7px;border:2px solid;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;transition:transform .16s,box-shadow .16s;position:relative;flex-shrink:0;box-shadow:0 3px 8px rgba(0,0,0,.6);}
.card:hover{transform:translateY(-8px) scale(1.1);z-index:30;box-shadow:0 8px 20px rgba(0,0,0,.7);}
.card.sel{box-shadow:0 0 0 2px var(--gold),0 8px 24px rgba(255,204,0,.5);transform:translateY(-10px) scale(1.12);z-index:40;}
.bz-wrap{position:relative;z-index:1;isolation:isolate;}
.bz-wrap:has(.card:hover){z-index:35;}
.bz-wrap:has(.card.sel){z-index:45;}
/* 常在型能力バッジ */
.permanent-badge{
  position:absolute;
  bottom:-6px;
  left:50%;
  transform:translateX(-50%);
  font-size:.65rem;
  font-weight:900;
  line-height:1;
  z-index:50;
  pointer-events:none;
  background:#ffcc00;
  color:#000;
  border-radius:3px;
  padding:1px 5px;
  letter-spacing:.02em;
  box-shadow:0 0 6px rgba(255,204,0,.7);
}
.card.effing{box-shadow:0 0 0 2px #ffcc00,0 0 16px rgba(255,204,0,.6);animation:effingPulse 0.8s ease-in-out infinite alternate;}
@keyframes effingPulse{from{box-shadow:0 0 0 2px #ffcc00,0 0 8px rgba(255,204,0,.4);}to{box-shadow:0 0 0 3px #ffee44,0 0 24px rgba(255,238,68,.8);}}
.card.flash-once{animation:flashOnce 1.0s ease-out forwards;}
@keyframes flashOnce{
  0%  {box-shadow:0 0 0 2px #fff,0 0 8px rgba(255,255,255,.4);filter:brightness(1);}
  25% {box-shadow:0 0 0 5px #ffee44,0 0 40px rgba(255,238,68,1);filter:brightness(2.0);}
  60% {box-shadow:0 0 0 3px #ffcc00,0 0 20px rgba(255,204,0,.6);filter:brightness(1.3);}
  100%{box-shadow:none;filter:brightness(1);}
}
/* 波紋エフェクト */
.ripple-container{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:100;}
.ripple-ring{position:absolute;top:50%;left:50%;border-radius:50%;border:2px solid rgba(255,238,68,0.9);transform:translate(-50%,-50%) scale(0);animation:rippleExpand 0.9s ease-out forwards;}
.ripple-ring:nth-child(2){animation-delay:0.15s;border-color:rgba(255,204,0,0.6);}
.ripple-ring:nth-child(3){animation-delay:0.30s;border-color:rgba(255,170,0,0.3);}
@keyframes rippleExpand{
  0%  {width:10px;height:10px;transform:translate(-50%,-50%) scale(0);opacity:1;}
  100%{width:10px;height:10px;transform:translate(-50%,-50%) scale(8);opacity:0;}
}
.card-badges{display:flex;gap:2px;justify-content:flex-start;flex-wrap:wrap;position:absolute;bottom:-18px;left:0;min-height:14px;pointer-events:none;}
.badge{font-size:.42rem;font-weight:900;padding:1px 3px;border-radius:3px;line-height:1.4;letter-spacing:.02em;}
.badge-sick{background:rgba(60,60,60,.75);color:#888;border:1px solid #555;}
.badge-mf{background:rgba(80,220,160,.85);color:#000;}
.badge-sa{background:rgba(255,80,80,.85);color:#fff;}
.badge-ar{background:rgba(160,80,220,.85);color:#fff;}
.badge-blocker{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;background:#111;border-radius:3px;border:1px solid #444;position:relative;}
.badge-blocker::after{content:'';display:block;width:7px;height:7px;border-radius:50%;background:#4499ff;box-shadow:0 0 4px #4499ff;}

/* 召喚エフェクト：カード画像が前面にバーンと出る */
#summon-fx{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:9998;}
#summon-fx.active{animation:summonFxAnim 0.9s ease-out forwards;}
#summon-fx-img{width:160px;height:224px;object-fit:cover;border-radius:10px;box-shadow:0 0 60px rgba(255,255,255,0.95),0 0 120px rgba(220,220,255,0.5);transform:scale(0);opacity:0;}
#summon-fx.active #summon-fx-img{animation:summonImgAnim 0.9s ease-out forwards;}

#summon-fx.spell #summon-fx-img{box-shadow:0 0 60px rgba(200,225,255,0.95),0 0 120px rgba(160,210,255,0.6);}
#summon-fx-icon{font-size:5rem;transform:scale(0);opacity:0;}
#summon-fx.active #summon-fx-icon{animation:summonImgAnim 0.9s ease-out forwards;}
/* 呪文エフェクト用オーバーレイ */
#summon-fx-spell-ring{position:absolute;width:220px;height:220px;border-radius:50%;border:3px solid rgba(200,225,255,0.0);pointer-events:none;}
#summon-fx.spell.active #summon-fx-spell-ring{animation:spellRingAnim 0.85s ease-out forwards;}
/* graveFx：墓地から出る演出（紫グロー） */
#summon-fx.grave #summon-fx-img{box-shadow:0 0 60px rgba(180,100,255,0.95),0 0 120px rgba(140,60,220,0.6);}
#summon-fx-grave-ring{position:absolute;width:220px;height:220px;border-radius:50%;border:3px solid rgba(180,100,255,0.0);pointer-events:none;}
#summon-fx.grave.active #summon-fx-grave-ring{animation:graveRingAnim 0.85s ease-out forwards;}
@keyframes graveRingAnim{0%{transform:scale(0.3);border-color:rgba(180,100,255,0.9);opacity:1;}100%{transform:scale(2.2);border-color:rgba(180,100,255,0);opacity:0;}}
@keyframes spellRingAnim{
  0%  {width:60px;height:60px;border-color:rgba(220,235,255,0.9);transform:scale(0.2);opacity:1;}
  50% {border-color:rgba(200,225,255,0.7);}
  100%{width:220px;height:220px;border-color:rgba(160,210,255,0.0);transform:scale(1.4);opacity:0;}
}
@keyframes summonImgAnim{
  0%  {transform:scale(0.3);opacity:0;}
  30% {transform:scale(1.15);opacity:1;}
  60% {transform:scale(1.05);opacity:1;}
  100%{transform:scale(1.3);opacity:0;}
}

/* ドローFx：山札から手元にカードが飛んでくる */
#draw-fx{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:9996;
}
#draw-fx-card{
  width:100px;height:140px;border-radius:8px;object-fit:cover;
  box-shadow:0 0 30px rgba(100,200,255,0.8),0 0 60px rgba(60,160,255,0.4);
  opacity:0;
  display:flex;align-items:center;justify-content:center;
  font-size:3rem;background:linear-gradient(135deg,#0a1a2e,#0e2440);
  border:2px solid rgba(100,200,255,0.5);
  position:relative;
}
#draw-fx-card img{width:100%;height:100%;object-fit:cover;border-radius:6px;}
/* 山札から飛んでくる */
@keyframes drawSlideIn{
  0%  {transform:translate(200px,-180px) scale(0.2);opacity:0;}
  50% {transform:translate(0,0) scale(1.1);opacity:1;}
  100%{transform:translate(0,0) scale(1.0);opacity:1;}
}
/* 手札へ吸い込まれる */
@keyframes drawSlideOut{
  0%  {transform:translate(0,0) scale(1.0);opacity:1;}
  100%{transform:translate(0,280px) scale(0.15);opacity:0;}
}
#draw-fx-card.slide-in{animation:drawSlideIn 0.35s ease-out forwards;}
#draw-fx-card.slide-out{animation:drawSlideOut 0.35s ease-in forwards;}
#discard-fx{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:9997;
}
#discard-fx-card{
  width:120px;height:168px;border-radius:8px;object-fit:cover;
  box-shadow:0 0 40px rgba(255,80,80,0.9),0 0 80px rgba(200,40,40,0.5);
  opacity:0;transform:scale(0.3);
  display:flex;align-items:center;justify-content:center;
  font-size:3.5rem;background:linear-gradient(135deg,#1e0a0a,#3a1010);
  border:2px solid rgba(255,80,80,0.5);
  position:relative;
}
#discard-fx-card img{width:100%;height:100%;object-fit:cover;border-radius:6px;}
/* 出現アニメーション */
@keyframes discardAppear{
  0%  {transform:scale(0.2);opacity:0;}
  40% {transform:scale(1.1);opacity:1;}
  70% {transform:scale(1.0);opacity:1;}
  100%{transform:scale(1.0);opacity:1;}
}
/* 吸い込みアニメーション（相手墓地：左上方向） */
@keyframes discardSuckOpp{
  0%  {transform:scale(1.0);opacity:1;}
  100%{transform:scale(0.1) translate(-350px,-300px);opacity:0;}
}
/* 吸い込みアニメーション（自分墓地：右下方向） */
@keyframes discardSuckMy{
  0%  {transform:scale(1.0);opacity:1;}
  100%{transform:scale(0.1) translate(350px,350px);opacity:0;}
}
#discard-fx-card.appear{animation:discardAppear 0.4s ease-out forwards;}
#discard-fx-card.suck-opp{animation:discardSuckOpp 0.45s ease-in forwards;}
#discard-fx-card.suck-my{animation:discardSuckMy 0.45s ease-in forwards;}


.card.tap{transform:rotate(18deg);}
.card.tap.sel{transform:rotate(18deg) translateY(-4px) scale(1.06);}
.card.sealed{opacity:.3;filter:grayscale(.9);}
.card.sealed::before{content:'🔒';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.2rem;z-index:2;}
/* 山札表示 */
.deck-pile{
  display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;
}
.deck-card{
  width:34px;height:46px;border-radius:5px;
  background:linear-gradient(135deg,#12122a,#1c1c3a);
  border:2px solid rgba(100,100,180,.5);
  position:relative;
  box-shadow:0 2px 6px rgba(0,0,0,.5);
  transition:box-shadow .3s;
}
/* 枚数に応じた厚み */
.deck-card.thick-3{box-shadow:
  2px 2px 0 rgba(15,15,40,.95),
  4px 4px 0 rgba(15,15,40,.85),
  6px 6px 0 rgba(15,15,40,.75),
  8px 8px 0 rgba(15,15,40,.65),
  9px 9px 5px rgba(0,0,0,.5);}
.deck-card.thick-2{box-shadow:
  2px 2px 0 rgba(15,15,40,.95),
  4px 4px 0 rgba(15,15,40,.85),
  5px 5px 3px rgba(0,0,0,.4);}
.deck-card.thick-1{box-shadow:
  1px 1px 0 rgba(15,15,40,.9),
  2px 2px 2px rgba(0,0,0,.3);}
.deck-card.thick-0{
  opacity:.35;
  box-shadow:none;
}
.deck-num{
  position:absolute;
  bottom:3px;left:0;right:0;
  text-align:center;
  font-size:.55rem;font-weight:900;
  color:rgba(255,255,255,.7);
  letter-spacing:.03em;
  text-shadow:0 1px 3px rgba(0,0,0,.9);
}
.deck-card.thick-0 .deck-num{color:rgba(255,100,100,.6);}
/* 召喚酔いヒヨコ演出 */
.chick-orbit{
  position:absolute;
  top:50%;left:50%;
  width:0;height:0;
  pointer-events:none;
  z-index:20;
}
.chick{
  position:absolute;
  font-size:.8rem;
  line-height:1;
  top:-6px;left:-6px;
  transform-origin:6px 6px;
  animation:chickOrbit 1.6s linear infinite;
}
.chick:nth-child(2){animation-delay:-0.8s;}
@keyframes chickOrbit{
  from{transform:rotate(0deg)   translateY(-20px);}
  to  {transform:rotate(-360deg) translateY(-20px);}
}
.cn{background:linear-gradient(160deg,#0d2210,#193219);border-color:#2a7a2a;box-shadow:0 3px 8px rgba(0,0,0,.6),inset 0 1px rgba(255,255,255,.05);}
.cd{background:linear-gradient(160deg,#10071e,#1e0e34);border-color:#6622aa;box-shadow:0 3px 8px rgba(0,0,0,.6),inset 0 1px rgba(255,255,255,.05);}
.cl{background:linear-gradient(160deg,#1e1e0e,#2a2a16);border-color:#aaaa22;box-shadow:0 3px 8px rgba(0,0,0,.6),inset 0 1px rgba(255,255,255,.05);}
.cm{background:linear-gradient(to bottom,#0d2210 0%,#0d2210 50%,#10071e 50%,#10071e 100%);border-color:#2a7a2a;border-bottom-color:#6622aa;position:relative;}
.cm::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(to right,#2a7a2a,#6622aa);pointer-events:none;z-index:1;}
.cname{font-size:.38rem;text-align:center;line-height:1.2;color:rgba(255,255,255,.85);word-break:break-all;max-height:26px;overflow:hidden;}
.ccost{position:absolute;top:1px;left:2px;font-size:.62rem;font-weight:900;color:var(--gold);text-shadow:0 1px 4px #000;}
.cpow{font-size:.44rem;font-weight:700;background:rgba(0,0,0,.7);border-radius:3px;padding:1px 3px;color:#fff;align-self:flex-end;}

/* ── 手札（扇形HS風） ── */
#g-hlbl{font-size:.46rem;color:rgba(255,255,255,.3);letter-spacing:.08em;flex-shrink:0;}
#g-hcards{display:flex;align-items:flex-end;justify-content:flex-start;flex:1;overflow-x:auto;overflow-y:visible;padding:0 8px 0;position:relative;width:100%;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent;}
#g-hcards::-webkit-scrollbar{height:3px;}
#g-hcards::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px;}
#g-hcards .card{width:72px;height:100px;margin:0 2px;flex-shrink:0;transition:transform .2s,box-shadow .2s;transform-origin:bottom center;}
#g-hcards .card:hover{transform:translateY(-28px) scale(1.12) !important;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.8),0 0 20px rgba(255,200,50,.3);}
#g-hcards .card.sel{transform:translateY(-32px) scale(1.15) !important;z-index:60;box-shadow:0 0 0 2px var(--gold),0 12px 32px rgba(255,204,0,.5);}

/* ── シールド ── */
.shields{display:flex;justify-content:center;gap:3px;flex-shrink:0;}
.sh{width:34px;height:46px;border-radius:5px;border:2px solid rgba(100,100,180,.5);background:linear-gradient(135deg,#12122a,#1c1c3a);display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:all .2s;overflow:hidden;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.5);}
.sh-i{border-color:rgba(120,120,220,.7);box-shadow:0 2px 8px rgba(80,80,200,.3),0 0 12px rgba(80,80,200,.15);padding:0;}

.sh-b{background:rgba(20,5,5,.5);border-color:rgba(80,20,20,.6);opacity:.35;}
.sh-p{animation:shPop .45s ease;}
@keyframes shPop{0%{transform:scale(1)}50%{transform:scale(1.25);box-shadow:0 0 20px rgba(255,68,34,.8)}100%{transform:scale(1)}}

.cact-btn{padding:5px 8px;border-radius:6px;border:1px solid;font-size:.6rem;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;transition:all .15s;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.8);}

/* ── 効果選択ポップアップ ── */

.csp-card img{width:100%;height:100%;object-fit:cover;}
.csp-card-icon{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#eee;background:linear-gradient(135deg,#1a1a3a,#0e0c1e);}
.csp-card-name{position:absolute;bottom:0;left:0;right:0;font-size:.36rem;background:rgba(0,0,0,.75);color:#eee;padding:1px 2px;text-align:center;line-height:1.3;}
.csp-card.selected{border-color:var(--gold);box-shadow:0 0 10px rgba(255,204,0,.6);transform:translateY(-4px) scale(1.06);}
.csp-card.skip-btn{background:rgba(255,255,255,.04);border-color:#666;display:flex;align-items:center;justify-content:center;font-size:.52rem;color:#aaa;width:auto;padding:0 8px;}
.csp-card.skip-btn:hover{border-color:#aaa;color:#eee;}
#csp-preview{display:none;}
#csp-prev-img img{width:44px;height:60px;object-fit:cover;border-radius:4px;}
#csp-prev-img .no-img{width:44px;height:60px;background:rgba(255,255,255,.05);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
#csp-prev-info{flex:1;display:flex;flex-direction:column;gap:3px;}
#csp-prev-name{font-size:.65rem;font-weight:700;color:var(--gold);}
#csp-prev-eff{font-size:.58rem;color:#aaa;line-height:1.5;}
#csp-footer{display:flex;gap:8px;}
#csp-cancel{flex:1;padding:7px;background:rgba(255,255,255,.04);border:1px solid #666;border-radius:8px;color:#aaa;font-size:.65rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
#csp-cancel:hover{border-color:#aaa;color:#eee;}
#csp-confirm{flex:2;padding:7px;background:rgba(255,204,0,.12);border:1px solid var(--gold);border-radius:8px;color:var(--gold);font-size:.65rem;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:background .15s;}
#csp-confirm:hover:not(:disabled){background:rgba(255,204,0,.25);}
#csp-confirm:disabled{opacity:.35;cursor:not-allowed;}

@keyframes mdIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
/* ── ログボタン（センターライン） ── */
#log-btn{padding:3px 8px;border-radius:10px;font-size:.58rem;font-weight:700;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.6);background:rgba(255,255,255,.07);cursor:pointer;transition:all .2s;font-family:'Noto Sans JP',sans-serif;flex-shrink:0;}
#log-btn:hover{background:rgba(255,204,0,.15);border-color:var(--gold);color:var(--gold);}

/* ── ログモーダル ── */
#log-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:350;align-items:flex-start;justify-content:flex-start;padding:60px 0 0 0;}

/* ── カードプレビューモーダル ── */
#card-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:900;align-items:center;justify-content:center;}
#card-modal.open{display:flex;}
#card-modal-inner{background:#0e0c1e;border:1px solid var(--gold);border-radius:12px;padding:16px;max-width:400px;width:95%;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 0 32px rgba(255,204,0,.25);animation:mdIn .2s ease;}
#card-modal-inner::-webkit-scrollbar{width:3px;}
#card-modal-inner::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);}
#cm-img-wrap{width:100%;display:flex;justify-content:center;}
#cm-img-wrap img{width:240px;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.6);}
#cm-img-wrap.no-img{width:60px;height:80px;background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;}
#cm-cardinfo{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--bdr);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;}
#cm-name{font-size:.82rem;font-weight:900;color:var(--gold);}
#cm-meta{font-size:.65rem;color:var(--muted);}
#cm-eff{font-size:.65rem;color:#ddd;line-height:1.8;white-space:pre-wrap;}
#cm-eff-twin{font-size:.62rem;color:#bb99ff;line-height:1.8;white-space:pre-wrap;border-top:1px solid rgba(255,255,255,.1);padding-top:6px;margin-top:2px;display:none;}

/* ── 墓地・マナ閲覧モーダル ── */
#zone-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;align-items:center;justify-content:center;}
#zone-modal.open{display:flex;}
#zone-modal-inner{background:#0e0c1e;border:1px solid var(--bdr);border-radius:10px;padding:14px;max-width:360px;width:94%;max-height:80vh;display:flex;flex-direction:column;gap:8px;box-shadow:0 0 24px rgba(0,0,0,.6);animation:mdIn .18s ease;}
#zm-title{font-size:.78rem;font-weight:900;color:var(--gold);letter-spacing:.06em;}
#zm-actions{display:flex;flex-direction:column;gap:4px;}
#zm-list{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:4px;}
#zm-list::-webkit-scrollbar{width:3px;}
#zm-list::-webkit-scrollbar-thumb{background:var(--bdr);}
.zm-row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:5px;background:rgba(255,255,255,.03);border:1px solid var(--bdr);cursor:pointer;transition:background .15s;}
.zm-row:hover{background:rgba(255,204,0,.08);border-color:var(--gold);}
.zm-row img{width:28px;height:38px;object-fit:cover;border-radius:3px;flex-shrink:0;}
.zm-row-icon{width:28px;height:38px;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.9rem;}
.zm-info{flex:1;min-width:0;}
.zm-name{font-size:.62rem;font-weight:700;color:#eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.zm-sub{font-size:.55rem;color:var(--muted);}
.zm-btns{display:flex;flex-direction:column;gap:3px;flex-shrink:0;}
.zm-btn{padding:3px 7px;border-radius:5px;border:1px solid;font-size:.55rem;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;transition:background .15s;}
.zm-btn-rush{border-color:#ff6699;color:#ff6699;background:rgba(255,102,153,.07);}
.zm-btn-rush:hover{background:rgba(255,102,153,.22);}
.zm-btn-spell{border-color:#aa44ff;color:#aa44ff;background:rgba(170,68,255,.07);}
.zm-btn-spell:hover{background:rgba(170,68,255,.22);}
#zm-close{padding:5px 18px;background:rgba(255,204,0,.1);border:1px solid var(--gold);border-radius:18px;color:var(--gold);font-size:.62rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif;align-self:center;}
#zm-close:hover{background:rgba(255,204,0,.22);}
#log-modal.open{display:flex;}
#log-modal-inner{background:#0a0a1a;border:1px solid rgba(255,255,255,.12);border-radius:10px;margin:0 0 0 12px;width:320px;max-height:70vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.8);animation:mdIn .18s ease;overflow:hidden;}
#log-modal-title{font-size:.65rem;font-weight:700;color:var(--gold);padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
#g-loglist{flex:1;overflow-y:auto;padding:6px 8px;}
#g-loglist::-webkit-scrollbar{width:3px;}
#g-loglist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);}
#log-modal-inner button{margin:6px 8px;padding:4px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);font-size:.58rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif;align-self:center;flex-shrink:0;}
#log-modal-inner button:hover{border-color:var(--gold);color:var(--gold);}

.zone-btns{display:flex;flex-direction:column;gap:3px;padding:4px 6px;}
.zone-btn{padding:5px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:rgba(255,255,255,.7);font-size:.58rem;font-family:'Noto Sans JP',sans-serif;cursor:pointer;text-align:left;transition:all .15s;}
.zone-btn:hover{background:rgba(255,255,255,.12);border-color:var(--gold);color:var(--gold);}
.zone-btn span{float:right;color:var(--gold);font-weight:700;}
/* ── 場を見る：戻るボタン ── */
#field-view-btn{display:none;position:fixed;left:50%;transform:translateX(-50%);z-index:800;padding:6px 20px;background:rgba(0,0,0,.92);border:2px solid var(--gold);border-radius:20px;color:var(--gold);font-size:.65rem;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;box-shadow:0 2px 12px rgba(0,0,0,.6);letter-spacing:.04em;white-space:nowrap;}
#field-view-btn.open{display:block;}

#scr-result{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
#scr-result.on{display:flex;}
.rb{background:var(--panel);border:1px solid var(--bdr);border-radius:12px;padding:28px 32px;text-align:center;max-width:300px;}
.rt{font-family:'Kaisei Decol',serif;font-size:1.7rem;margin-bottom:8px;}
.rs{font-size:.76rem;color:var(--muted);margin-bottom:18px;line-height:1.6;}
.rbtn{padding:9px 26px;border-radius:7px;border:1px solid var(--gold);color:var(--gold);background:rgba(255,204,0,.1);font-size:.8rem;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.rbtn:hover{background:rgba(255,204,0,.25);}

/* エフェクト */
.fxfl{position:fixed;inset:0;pointer-events:none;z-index:700;background:rgba(255,68,34,.16);animation:fxflA .4s ease forwards;}
@keyframes fxflA{0%{opacity:1}100%{opacity:0}}
.fxft{position:fixed;font-family:'Kaisei Decol',serif;font-size:1.3rem;font-weight:700;pointer-events:none;z-index:700;animation:fxftA 1.2s ease forwards;text-shadow:0 2px 8px #000;}
@keyframes fxftA{0%{opacity:1;transform:translateY(0) scale(1)}80%{opacity:.8;transform:translateY(-50px) scale(1.1)}100%{opacity:0;transform:translateY(-70px) scale(.9)}}
</style>
</head>
<body>

<!-- タイトル -->
<div id="scr-title" class="on">
  <div class="t-logo">
    <div class="t-sub">Trading Card Game</div>
    <div class="t-main">デュエルマスターズ<br>シミュレーター</div>
    <div class="t-en">DUEL MASTERS SIMULATOR</div>
  </div>
  <div class="t-deck" id="t-deck-display" onclick="openDeckModal()">
    <div class="t-deck-icons" id="t-deck-icons">🌿🌑🌿🌑</div>
    <div class="t-deck-badge" id="t-deck-badge">黒緑アビス（40枚）</div>
    <div style="font-size:.5rem;color:rgba(255,255,255,.3);margin-top:2px;">タップしてデッキ変更</div>
  </div>
  <div class="t-btn-row">
    <button class="t-sub-btn" onclick="openCardListModal()">📋 カード一覧</button>
    <button class="t-sub-btn" onclick="openDeckModal()">📦 デッキ</button>
  </div>
  <button class="t-start" onclick="startCoin()">デュエル開始</button>
  <button class="t-test" onclick="startTest()">🔧 テストモード</button>
  <button id="ver-badge" onclick="openVerModal()"></button>
</div>

<!-- バージョンモーダル -->
<div id="ver-modal" onclick="closeVerModal()">
  <div id="ver-modal-inner" onclick="event.stopPropagation()">
    <h2>📋 変更履歴</h2>
    <div id="ver-modal-list"></div>
    <button class="modal-close-btn" onclick="closeVerModal()">✕ 閉じる</button>
  </div>
</div>

<!-- コイントス -->
<div id="scr-coin">
  <div class="c-head">先攻・後攻を決定中...</div>
  <div id="c-icon" class="c-spin">🪙</div>
  <div id="c-result"></div>
  <div id="c-sub"></div>
  <button id="c-go" onclick="startGame()">ゲームスタート！</button>
</div>

<!-- ゲーム -->
<div id="scr-game">
<div id="summon-fx"><img id="summon-fx-img" src="" alt=""><div id="summon-fx-icon"></div><div id="summon-fx-spell-ring"></div><div id="summon-fx-grave-ring"></div></div>
<div id="discard-fx"><div id="discard-fx-card"></div></div>
<div id="draw-fx"><div id="draw-fx-card"></div></div>
  <div id="test-badge">🔧 テストモード：マナコスト0</div>
  <div id="g-header">
    <button id="g-home-btn" onclick="goTitle()">🏠</button>
    <h1>⚔️ デュエルマスターズシミュレーター</h1>
    <div class="g-hright">
      <div class="g-fbadge fb-you" id="g-fbadge">先攻: -</div>
      <div class="g-turn">ターン <span id="g-turn">1</span> ｜ <span id="g-phase">-</span></div>
    </div>
  </div>

  <!-- メインフィールド -->
  <div id="g-board">
    <div id="g-field">

      <!-- 相手手札（右上・枚数バッジ） -->
      <div id="ohand-area">
        <div id="ohand-badge">🂠 相手手札<br><span id="ohcnt">0</span>枚</div>
      </div>

      <!-- 相手マナ（シールドの上＝こちらから見て） -->
      <div class="field-row row-mana">
        <span class="field-lbl" id="omnalbl">相手マナ 0</span>
        <div class="mzone" id="omna"></div>
      </div>

      <!-- 相手シールド＋山札＋墓地 -->
      <div class="field-row row-oshield">
        <button class="grave-btn opp-grave" onclick="showGraveModal('opp')">🪦<span id="ogcnt">0</span></button>
        <div class="deck-pile" id="opp-deck-pile"><div class="deck-card thick-3" id="opp-deck-card"><span class="deck-num" id="odcnt">40</span></div></div>
        <div class="shields" id="osh"></div>
      </div>

      <!-- 相手バトルゾーン -->
      <div class="field-row row-bzone">
        <div class="bzone bz-o" id="obz" data-empty="クリーチャーなし"></div>
      </div>

      <!-- センターライン -->
      <div id="g-centerline">
        <button id="log-btn" onclick="toggleLogModal()">📜 <span id="log-badge" class="log-badge" style="display:none;">0</span></button>
        <div class="divr"></div>
        <span id="center-phase" class="phase-label">-</span>
        <div class="divr"></div>
        <button class="pbtn" id="pbtn" onclick="nextPhase()">▶</button>
      </div>

      <!-- 自分バトルゾーン -->
      <div class="field-row row-bzone">
        <div class="bzone bz-y" id="mbz" data-empty="クリーチャーなし"></div>
      </div>

      <!-- 自分シールド＋墓地ボタン -->
      <div class="field-row row-mshield">
        <div class="shields" id="msh"></div>
        <div class="deck-pile" id="my-deck-pile"><div class="deck-card thick-3" id="my-deck-card"><span class="deck-num" id="dcnt">40</span></div></div>
        <button class="grave-btn my-grave" onclick="showGraveModal('my')">🪦<span id="gcnt">0</span></button>
      </div>

      <!-- 自分マナ（シールドの下） -->
      <div class="field-row row-mana">
        <span class="field-lbl" id="mnalbl">マナ 0/0</span>
        <div class="mzone" id="mna"></div>
      </div>

    </div><!-- end g-field -->
  </div><!-- end g-board -->

  <!-- 手札エリア（g-boardの外・scr-game直下） -->
  <div id="g-hand">
    <div id="g-hlbl">手札（0枚）</div>
    <div id="g-hcards"></div>
  </div>

</div><!-- end scr-game -->

<!-- カード一覧モーダル -->
<div id="card-list-modal" onclick="closeCardListModal()">
  <div id="clm-inner" onclick="event.stopPropagation()">
    <div class="modal-title">📋 カード一覧</div>
    <div id="clm-list"></div>
    <button class="modal-close-btn" onclick="closeCardListModal()">✕ 閉じる</button>
  </div>
</div>

<!-- デッキモーダル -->
<div id="deck-modal" onclick="closeDeckModal()">
  <div id="dm-inner" onclick="event.stopPropagation()">
    <div class="modal-title">📦 デッキ管理</div>
    <div id="dm-saved-list"></div>
    <div id="dm-editor">
      <div id="dm-editor-header">
        <input id="dm-deck-name" type="text" placeholder="デッキ名" maxlength="20">
        <button onclick="saveDeck()">💾 保存</button>
      </div>
      <div id="dm-editor-cards"></div>
    </div>
    <button class="modal-close-btn" onclick="closeDeckModal()">✕ 閉じる</button>
  </div>
</div>

<!-- ログモーダル -->
<div id="log-modal" onclick="closeLogModal()">
  <div id="log-modal-inner" onclick="event.stopPropagation()">
    <div id="log-modal-title">📜 ゲームログ</div>
    <div id="g-loglist"></div>
    <button onclick="closeLogModal()">✕ 閉じる</button>
  </div>
</div>

<!-- 場を見る：戻るボタン -->
<button id="field-view-btn" onclick="closeFieldViewModal()">◀ ポップアップに戻る</button>

<!-- カードアクションポップアップ（fixed） -->
<div id="card-action-popup"></div>

<!-- 墓地・マナ閲覧モーダル -->
<div id="zone-modal" onclick="closeZoneModal()">
  <div id="zone-modal-inner" onclick="event.stopPropagation()">
    <div id="zm-title"></div>
    <div id="zm-actions"></div>
    <div id="zm-list"></div>
    <button id="zm-close" onclick="closeZoneModal()">✕ 閉じる</button>
  </div>
</div>

<!-- カードプレビューモーダル -->
<div id="card-modal" onclick="closeCardModal()">
  <div id="card-modal-inner" onclick="event.stopPropagation()">
    <div id="cm-img-wrap"></div>
    <div id="cm-cardinfo">
      <div id="cm-name"></div>
      <div id="cm-meta"></div>
      <div id="cm-eff"></div>
      <div id="cm-eff-twin"></div>
    </div>
  </div>
</div>

<!-- 効果選択ポップアップ（はい/いいえ系） -->
<div id="eff-popup">
  <div id="eff-popup-inner">
    <div id="eff-title"></div>
    <div id="eff-desc"></div>
    <div id="eff-btns"></div>
    <button id="eff-confirm" onclick="confirmEffPopup()" disabled style="margin-top:8px;padding:7px 20px;background:rgba(255,204,0,.12);border:1px solid var(--gold);border-radius:8px;color:var(--gold);font-size:.65rem;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;width:100%;transition:background .15s;">✅ 決定</button>
    <button onclick="openFieldViewModal()" style="margin-top:4px;padding:5px 20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:rgba(255,255,255,.5);font-size:.58rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif;width:100%;">👁 場を見る</button>
  </div>
</div>

<!-- はい/いいえポップアップ -->
<div id="yn-popup">
  <div id="yn-popup-inner">
    <div id="yn-title"></div>
    <div id="yn-desc"></div>
    <div id="yn-btns">
      <button id="yn-yes" onclick="confirmYesNo(true)">はい</button>
      <button id="yn-no" onclick="confirmYesNo(false)">いいえ</button>
    </div>
    <button id="yn-fieldview" onclick="openFieldViewModal()">👁 場を見る</button>
  </div>
</div>

<!-- カード選択ポップアップ -->
<div id="card-sel-popup" onclick="event.stopPropagation()">
  <div id="csp-inner">
    <div id="csp-title"></div>
    <div id="csp-desc"></div>
    <div id="csp-cards"></div>
    <div id="csp-preview">
      <div id="csp-prev-img"></div>
      <div id="csp-prev-info">
        <div id="csp-prev-name"></div>
        <div id="csp-prev-eff"></div>
      </div>
    </div>
    <div id="csp-footer">
      <button id="csp-cancel" onclick="cancelCardSel()">✕ キャンセル</button>
      <button id="csp-confirm" onclick="confirmCardSel()" disabled>✅ 決定</button>
      <button onclick="openFieldViewModal()" style="padding:7px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:rgba(255,255,255,.5);font-size:.58rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif;flex-shrink:0;">👁</button>
    </div>
  </div>
</div>

<!-- 結果 -->
<div id="scr-result">
  <div class="rb">
    <div class="rt" id="r-title">勝利！</div>
    <div class="rs" id="r-sub"></div>
    <button class="rbtn" onclick="goTitle()">タイトルへ戻る</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════
   カードデータ（data/cards.jsonから読み込み）
══════════════════════════════════════════ */
/* ══ バージョン情報 ══
   type: 'add'=緑 / 'fix'=赤 / 'chg'=青
*/
var VERSION_LOG = [
  {
    ver: 'v0.11.7', date: '2026-05-14',
    logs: [
      {type:'add', text:'drawFx(card, callback)を追加。山札からカードが手元に飛んでくるアニメーション'},
      {type:'chg', text:'myDraw(silent, fx, callback)にfx引数を追加。フェーズドロー時のみFxを再生'},
    ]
  },
  {
    ver: 'v0.11.6', date: '2026-05-14',
    logs: [
      {type:'add', text:'showYesNo(title, desc, callback)を追加。横並びはい/いいえ＋場を見るボタン付きの汎用Yes/Noポップアップ'},
      {type:'chg', text:'テレスのドロー選択をshowYesNoに変更'},
    ]
  },
  {

function renderVersionBadge(){
  var latest = VERSION_LOG[0];
  var badge = document.getElementById('ver-badge');
  if(!badge) return;
  badge.textContent = latest.ver + '  ' + latest.date;
}

function openVerModal(){
  var list = document.getElementById('ver-modal-list');
  if(!list) return;
  list.innerHTML = '';
  for(var vi=0; vi<VERSION_LOG.length; vi++){
    var v = VERSION_LOG[vi];
    var block = document.createElement('div');
    block.className = 'vm-block';
    var hdr = '<div class="vm-header"><span class="vm-ver">'+v.ver+'</span><span class="vm-date">'+v.date+'</span></div>';
    var logs = '<div class="vm-logs">';
    for(var li=0; li<v.logs.length; li++){
      logs += '<div class="vm-log '+v.logs[li].type+'">'+v.logs[li].text+'</div>';
    }
    logs += '</div>';
    block.innerHTML = hdr + logs;
    list.appendChild(block);
    if(vi < VERSION_LOG.length-1){
      var sep = document.createElement('div');
      sep.className = 'vm-sep';
      list.appendChild(sep);
    }
  }
  document.getElementById('ver-modal').className = 'open';
}

function closeVerModal(){
  document.getElementById('ver-modal').className = '';
}

/* ══ cards.jsonを読み込んでDECK・CARD_IMAGESを構築 ══ */
function loadCardsJson(callback) {
  fetch('data/cards.json')
    .then(function(r){
      if(!r.ok) throw new Error('cards.json読み込み失敗: '+r.status);
      return r.json();
    })
    .then(function(data){
      // DECK構築
      DECK = data.cards.map(function(c){
        var entry = {
          id: c.id, name: c.name, cost: c.cost, pow: c.pow,
          type: c.type, civ: c.civ, race: c.race, icon: c.icon,
          eff: c.eff, n: c.count, twin: c.twin || false
        };
        if(c.twin){
          entry.spellName = c.spellName;
          entry.spellCost = c.spellCost;
          entry.spellEff  = c.spellEff;
        }
        return entry;
      });
      // CARD_IMAGES構築（cardbackは保持）
      data.cards.forEach(function(c){
        if(c.image) CARD_IMAGES[c.id] = c.image;
      });
      // アビスID上書き
      if(data.abyssIds) ABYSS_IDS = data.abyssIds;
      // デッキ名をタイトル画面に反映
      var total = DECK.reduce(function(s,c){return s+c.n;},0);
      var badge = document.getElementById('t-deck-badge');
      if(badge) badge.textContent = data.deckName+'（'+total+'枚）';
      callback();
    })
    .catch(function(e){
      console.error(e);
      alert('カードデータの読み込みに失敗しました。\nLive Server経由で開いているか確認してください。\n\n'+e.message);
    });
}

function showScr(id){
  var ids=['scr-title','scr-coin','scr-game'];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    if(el) el.className = (ids[i]===id) ? 'on' : '';
  }
}

var G={myFirst:true};
var G_testMode=false;
var UID=0;
function nuid(){return ++UID;}

function buildDeck(){
  var deck=[];
  for(var i=0;i<DECK.length;i++){
    var c=DECK[i];
    for(var j=0;j<c.n;j++) deck.push({id:c.id,name:c.name,cost:c.cost,pow:c.pow,type:c.type,civ:c.civ,icon:c.icon,eff:c.eff,uid:nuid(),twin:c.twin||false,spellName:c.spellName||'',spellCost:c.spellCost||0,spellEff:c.spellEff||''});
  }
  for(var k=deck.length-1;k>0;k--){
    var r=Math.floor(Math.random()*(k+1));
    var tmp=deck[k];deck[k]=deck[r];deck[r]=tmp;
  }
  return deck;
}

var G_currentDeckEdit=[]; // 現在編集中のデッキ {id, n}

function renderDeckEditor(){
  var el=document.getElementById('dm-editor-cards'); el.innerHTML='';
  var total=0;
  for(var i=0;i<G_currentDeckEdit.length;i++){
    var entry=G_currentDeckEdit[i];
    total+=entry.n;
    var def=null; for(var j=0;j<DECK.length;j++){if(DECK[j].id===entry.id){def=DECK[j];break;}}
    if(!def) continue;
    var row=document.createElement('div'); row.className='dm-card-row';
    if(CARD_IMAGES[entry.id]){var img=document.createElement('img');img.className='dm-card-img';img.src=CARD_IMAGES[entry.id];row.appendChild(img);}
    else{var ic=document.createElement('div');ic.className='dm-card-icon';ic.textContent=def.icon||'🃏';row.appendChild(ic);}
    var info=document.createElement('div'); info.className='dm-card-info';
    info.innerHTML='<div class="dm-card-n">'+def.name+'</div><div class="dm-card-c">コスト'+def.cost+(def.pow?' P:'+def.pow:'')+'</div>';
    row.appendChild(info);
    var qty=document.createElement('div'); qty.className='dm-qty';
    var bm=document.createElement('button'); bm.textContent='－';
    var val=document.createElement('div'); val.className='dm-qty-val'; val.textContent=entry.n;
    var bp=document.createElement('button'); bp.textContent='＋';
    (function(e,v){
      bm.onclick=function(){if(e.n>0){e.n--;v.textContent=e.n;}};
      bp.onclick=function(){if(e.n<4){e.n++;v.textContent=e.n;}};
    })(entry,val);
    qty.appendChild(bm); qty.appendChild(val); qty.appendChild(bp);
    row.appendChild(qty);
    el.appendChild(row);
  }
  // 合計枚数表示
  var h=document.querySelector('.modal-title');
  // ヘッダーに枚数を反映
  document.querySelector('#dm-inner .modal-title').textContent='📦 デッキ管理（'+total+'枚）';
}

async function saveDeck(){
  var name=document.getElementById('dm-deck-name').value.trim();
  if(!name){alert('デッキ名を入力してください');return;}
  var total=G_currentDeckEdit.reduce(function(s,e){return s+e.n;},0);
  if(total<1){alert('カードが0枚です');return;}
  var data={name:name,cards:G_currentDeckEdit,total:total,savedAt:Date.now()};
  try{
    await window.storage.set('deck:'+name, JSON.stringify(data));
    loadSavedDeckList();
    alert('「'+name+'」を保存しました（'+total+'枚）');
  }catch(e){alert('保存に失敗しました: '+e);}
}

async function loadSavedDeckList(){
  var el=document.getElementById('dm-saved-list'); el.innerHTML='';
  var h=document.createElement('div');
  h.style.cssText='font-size:.56rem;color:rgba(255,255,255,.35);margin-bottom:2px;';
  h.textContent='保存済みデッキ';
  el.appendChild(h);
  try{
    var keys=await window.storage.list('deck:');
    if(!keys||!keys.keys||keys.keys.length===0){
      var em=document.createElement('div'); em.style.cssText='font-size:.55rem;color:rgba(255,255,255,.25);padding:4px;'; em.textContent='保存済みデッキなし';
      el.appendChild(em); return;
    }
    for(var i=0;i<keys.keys.length;i++){
      var result=await window.storage.get(keys.keys[i]);
      if(!result) continue;
      var data=JSON.parse(result.value);
      var row=document.createElement('div'); row.className='dm-saved-item';
      var nm=document.createElement('div'); nm.className='dm-saved-name'; nm.textContent=data.name;
      var cnt=document.createElement('div'); cnt.className='dm-saved-count'; cnt.textContent=data.total+'枚';
      var lb=document.createElement('button'); lb.className='dm-load-btn'; lb.textContent='読込';
      var db=document.createElement('button'); db.className='dm-del-btn'; db.textContent='削除';
      (function(d,k){
        lb.onclick=function(){loadDeck(d);};
        db.onclick=async function(){
          if(!confirm('「'+d.name+'」を削除しますか？')) return;
          await window.storage.delete(k); loadSavedDeckList();
        };
      })(data,keys.keys[i]);
      row.appendChild(nm); row.appendChild(cnt); row.appendChild(lb); row.appendChild(db);
      el.appendChild(row);
    }
  }catch(e){
    var em=document.createElement('div'); em.style.cssText='font-size:.55rem;color:rgba(255,150,150,.6);padding:4px;'; em.textContent='ストレージ読込エラー';
    el.appendChild(em);
  }
}

function loadDeck(data){
  G_currentDeckEdit=data.cards.map(function(e){return{id:e.id,n:e.n};});
  document.getElementById('dm-deck-name').value=data.name;
  renderDeckEditor();
  // 現在のデッキに適用
  applyDeckEdit(data.name);
}

function applyDeckEdit(name){
  // DECK配列のnを更新
  for(var i=0;i<DECK.length;i++){
    for(var j=0;j<G_currentDeckEdit.length;j++){
      if(DECK[i].id===G_currentDeckEdit[j].id){DECK[i].n=G_currentDeckEdit[j].n;break;}
    }
  }
  var total=G_currentDeckEdit.reduce(function(s,e){return s+e.n;},0);
  var badge=document.getElementById('t-deck-badge');
  if(badge) badge.textContent=(name||'カスタムデッキ')+'（'+total+'枚）';
  log('s','デッキ「'+(name||'カスタム')+'」を読み込みました（'+total+'枚）');
}

/* ══ ゲーム初期化 ══ */
function initGame(){
  // ロック関連フラグをリセット
  G_triggerQueue = [];
  G_triggerQueueOnComplete = null;
  G_triggerResolving = false;
  G_fxRunning = false;
  G_popupWaiting = false;

  var md=buildDeck(), od=buildDeck();
  var msh=md.splice(md.length-5,5);
  var osh=od.splice(od.length-5,5);
  G={
    myFirst:G.myFirst, turn:1, phase:-1,
    PHASES:['アンタップ','ドロー','チャージ','メイン','攻撃'],
    myDeck:md, myHand:[], myBattle:[], myMana:[],
    myShields:msh.map(function(c){return{intact:true,card:c};}),
    oppDeck:od, oppHand:[], oppBattle:[], oppMana:[],
    oppShields:osh.map(function(c){return{intact:true,card:c};}),
    grave:[], oppGrave:[], sel:null, charged:false, costBonus:0, over:false, turnCreatureCount:0, jagaisutoUsed:false
  };
  for(var i=0;i<5;i++) myDraw(true);
  for(var i=0;i<5;i++){if(G.oppDeck.length>0)G.oppHand.push(G.oppDeck.pop());}
  log('s','── デュエル・スタート！ ──');
  log('s','自'+G.myDeck.length+'枚 / 相手'+G.oppDeck.length+'枚');
  render();
  if(G.myFirst){
    log('s','先攻1Tはドローなし。チャージから開始。');
    safeTimeout(function(){G.phase=2;runPhase();},600);
  } else {
    setPBtn('（相手ターン中）');
    log('s','相手の先攻です...');
    safeTimeout(oppTurn,900);
  }
}

/* ══ ドロー ══ */
/* myDraw(silent, fx, callback)
   silent   : true=ログなし
   fx       : true=ドローFxを再生
   callback : Fx完了後のコールバック（fx=trueの時のみ使用）
*/
function myDraw(silent, fx, callback){
  if(G.myDeck.length===0){endGame(false,'山札切れ');return;}
  var c=G.myDeck.pop(); G.myHand.push(c);
  if(!silent) log('s','「'+c.name+'」をドロー');
  if(fx){
    render();
    drawFx(c, callback || function(){});
  } else {
    if(callback) callback();
  }
}

/* ══ フェイズ ══ */
var G_chargeTimer=null;
function nextPhase(){
  if(isLocked()) return;
  if(G.over) return;
  G.phase++;
  if(G.phase>=5){endTurn();return;}
  runPhase();
}
function runPhase(){
  var p=G.phase;
  setPhase(G.PHASES[p]);
  if(p===0){
    for(var i=0;i<G.myBattle.length;i++){ G.myBattle[i].tapped=false; G.myBattle[i].summoned=false; G.myBattle[i].attacked=false; }
    for(var i=0;i<G.myMana.length;i++) G.myMana[i].tapped=false;
    G.charged=false; G.costBonus=0; G.turnCreatureCount=0; G.jagaisutoUsed=false;
    // 封印解除：自分ターン開始時、封印中の相手クリーチャーの封印を1枚解除
    // （封印カードは山札の上から置かれる想定だが、このシミュでは「封印は次のターン開始時に外れる」簡易実装）
    var unsealed=[];
    for(var i=0;i<G.oppBattle.length;i++){
      if(G.oppBattle[i].sealed){
        G.oppBattle[i].sealed=false;
        unsealed.push(G.oppBattle[i].name);
      }
    }
    if(unsealed.length>0) log('w','✨ 封印解除：「'+unsealed.join('」「')+'」の封印が外れた！');
    log('s','── ターン'+G.turn+' アンタップ ──'); render();
    safeTimeout(function(){G.phase=1;runPhase();},400); return;
  }
  if(p===1){
    myDraw(false, true, function(){
      safeTimeout(function(){G.phase=2;runPhase();},200);
    });
    return;
  }
  if(p===2){setPhase('チャージ');setPBtn('スキップ▶');log('s','チャージ：手札からマナに1枚置けます');render();return;}
  if(p===3){setPhase('メイン');setPBtn('攻撃へ▶');log('s','メイン：召喚・呪文が使えます');render();return;}
  if(p===4){setPhase('攻撃');setPBtn('ターン終了▶');log('s','攻撃：クリーチャーで攻撃できます');G.sel=null;render();updateBtns();return;}
}
function endTurn(){
  if(isLocked()) return;
  if(G.over) return;
  G.sel=null; G.costBonus=0;

  // ① アビスラッシュ送還をキューに積む
  var rushers=G.myBattle.filter(function(x){return x.abyssRush;});
  for(var ri=0;ri<rushers.length;ri++){
    (function(r){
      queueTrigger('「'+r.name+'」アビスラッシュ送還', r.uid, function(done){
        // 解決時点でまだ場にいるか確認
        if(G.myBattle.filter(function(x){return x.uid===r.uid;}).length===0){done();return;}
        if(r.endOfTurn==='toBottom'){
          G.myBattle=G.myBattle.filter(function(x){return x.uid!==r.uid;});
          G.myDeck.unshift(r);
          log('w','🌑 アビスラッシュ：「'+r.name+'」を山札の下へ');
        } else if(r.endOfTurn==='toBottomIfAttacked'){
          if(r.attacked){
            G.myBattle=G.myBattle.filter(function(x){return x.uid!==r.uid;});
            G.myDeck.unshift(r);
            log('w','🌑 アビスラッシュ：「'+r.name+'」を山札の下へ');
          } else {
            r.abyssRush=false; r.endOfTurn=null;
            log('w','🌑 ジャガイスト：「'+r.name+'」は未攻撃のためバトルゾーンに残留');
          }
        }
        render(); done();
      });
    })(rushers[ri]);
  }

  // ② 場のカードのonTurnEndをfireEventで処理
  fireEvent('onTurnEnd', {});

  // ③ キューを全解決 → 相手ターンへ
  log('s','ターン終了 → 相手のターン'); render();
  resolveTriggerQueue(function(){
    safeTimeout(oppTurn, 500);
  });
}

/* ══ 相手AI ══ */
function oppTurn(){
  if(G.over) return;
  G.turn++;
  document.getElementById('g-turn').textContent=G.turn;
  setPBtn('（相手ターン中）'); setPhase('相手ターン');
  log('s','── 相手ターン'+G.turn+' ──');
  for(var i=0;i<G.oppBattle.length;i++){ G.oppBattle[i].tapped=false; G.oppBattle[i].summoned=false; }

  // ターン開始時誘発（テレス等）→ 全解決後にドロー・行動へ
  fireEvent('onTurnStart', {});
  resolveTriggerQueue(function(){
    oppTurnMain();
  });
}

function oppTurnMain(){
  if(G.over) return;
  // ドロー
  if(G.oppDeck.length>0) G.oppHand.push(G.oppDeck.pop());
  // マナチャージ判断：手札の中で最もコストが高いクリーチャーを出すのに必要なマナと比較
  if(G.oppHand.length>0){
    var maxCost=0;
    for(var i=0;i<G.oppHand.length;i++) if(G.oppHand[i].type==='creature'&&G.oppHand[i].cost>maxCost) maxCost=G.oppHand[i].cost;
    // マナが足りない、またはまだ序盤（7マナ以下）ならチャージする
    var shouldCharge = G.oppMana.length < maxCost || G.oppMana.length < 7;
    if(shouldCharge){
      // チャージするカードを選ぶ：召喚したいカード以外の最低コストを優先
      G.oppHand.sort(function(a,b){return a.cost-b.cost;});
      // 手札が複数ある場合、最高コストクリーチャーはチャージしない
      var chargeIdx=0;
      if(G.oppHand.length>1){
        var maxCreature=null, maxCreatureIdx=-1;
        for(var i=0;i<G.oppHand.length;i++){
          if(G.oppHand[i].type==='creature'&&(!maxCreature||G.oppHand[i].cost>maxCreature.cost)){
            maxCreature=G.oppHand[i]; maxCreatureIdx=i;
          }
        }
        // 最高コストクリーチャー以外で最低コストのものをチャージ
        if(maxCreatureIdx===0&&G.oppHand.length>1) chargeIdx=1;
      }
      var oc=G.oppHand.splice(chargeIdx,1)[0];
      var ocMul=(oc.civ==='m');
      G.oppMana.push({id:oc.id,name:oc.name,cost:oc.cost,pow:oc.pow,type:oc.type,civ:ocMul?'nd':oc.civ,icon:oc.icon,eff:oc.eff,tapped:ocMul,uid:nuid()});
      log('s','相手マナチャージ（'+G.oppMana.length+'マナ）');
    } else {
      log('s','相手：マナチャージせず（'+G.oppMana.length+'マナ）');
    }
  }
  render();
  setTimeout(function(){
    // 召喚
    var pl=[];
    for(var i=0;i<G.oppHand.length;i++){var c=G.oppHand[i];if(c.type==='creature'&&c.cost<=G.oppMana.length)pl.push(c);}
    pl.sort(function(a,b){return b.cost-a.cost;});
    if(pl.length>0){
      var s=pl[0];
      G.oppHand=G.oppHand.filter(function(c){return c.uid!==s.uid;});
      for(var _i=0;_i<s.cost&&_i<G.oppMana.length;_i++) G.oppMana[_i].tapped=true; // 相手マナ消費
      G.oppBattle.push(makeCard(s, {uid:s.uid, summoned:true}));
      log('m','相手「'+s.name+'」召喚（コスト'+s.cost+'）');
      oppSummonEff(s); render();
    }
    setTimeout(oppAttackLoop,600);
  },700);
}
function oppAttackLoop(){
  if(G.over) return;
  // 召喚酔いしていない・タップしていないクリーチャーのみ攻撃可（SAは召喚酔い無視）
  var atkers=G.oppBattle.filter(function(c){return !c.tapped&&!c.sealed&&(!c.summoned||(c.eff&&c.eff.indexOf('スピードアタッカー')!==-1));});
  if(atkers.length===0){log('s','相手ターン終了 → あなたのターン');render();safeTimeout(function(){G.phase=0;runPhase();},350);return;}
  var atk=atkers[0]; atk.tapped=true; render();
  safeTimeout(function(){oppAtk(atk);render();safeTimeout(oppAttackLoop,450);},400);
}
function oppAtk(atk){
  var tappedMine=G.myBattle.filter(function(x){return x.tapped;});
  // タップクリーチャーへの攻撃とシールド攻撃をランダムに選択
  var attackTarget = (tappedMine.length>0&&Math.random()>.4) ? 'creature' : 'player';
  var def = attackTarget==='creature' ? tappedMine[Math.floor(Math.random()*tappedMine.length)] : null;

  // ブロッカーチェック（自分のアンタップブロッカー）
  var isUnblockable = atk.eff && atk.eff.indexOf('ブロックされない')!==-1;
  var myBlockers = G.myBattle.filter(function(x){
    return !x.tapped && !x.sealed && hasAbility(x,'ブロッカー');
  });

  if(!isUnblockable && myBlockers.length>0){
    // ブロックポップアップを表示
    var blockOpts = myBlockers.map(function(b){
      return {label:'🛡 「'+b.name+'」（P:'+b.pow+'）でブロック', cls:''};
    });
    blockOpts.push({label:'✋ ブロックしない', cls:'no'});

    var attackDesc = attackTarget==='creature'
      ? '相手「'+atk.name+'」('+atk.pow+') が「'+def.name+'」に攻撃！'
      : '相手「'+atk.name+'」('+atk.pow+') がプレイヤーに攻撃！';

    showPopup('ブロックしますか？', attackDesc, blockOpts, function(bidx){
      if(bidx===blockOpts.length-1){
        // ブロックしない→通常処理
        log('l', attackDesc+' ブロックせず');
        oppAtkResolve(atk, attackTarget, def);
      } else {
        var blocker = myBlockers[bidx];
        log('l','🛡「'+blocker.name+'」がブロック！');
        blocker.tapped=true;
        battle(atk, blocker, false);
        render(); updateBtns();
      }
    });
    return;
  }

  oppAtkResolve(atk, attackTarget, def);
}

function oppAtkResolve(atk, attackTarget, def){
  if(attackTarget==='creature' && def){
    log('l','相手「'+atk.name+'」('+atk.pow+') → 「'+def.name+'」('+def.pow+') [タップ]');
    battle(atk,def,false);
  } else {
    // シールドへ攻撃（AIは先頭から順番に割る）
    var intactIdxs=[];
    for(var i=0;i<G.myShields.length;i++) if(G.myShields[i].intact) intactIdxs.push(i);
    if(intactIdxs.length===0){
      log('l','💥 ダイレクトアタック！'); endGame(false,atk.name+'のダイレクトアタック'); return;
    }
    // ブレイク数を判定
    var oppBc=calcBreakCount(atk, intactIdxs.length);
    var actual=Math.min(oppBc.count, intactIdxs.length);
    log('l','相手「'+atk.name+'」プレイヤーへ攻撃！（'+BREAKER_LABEL[oppBc.type]+'）');
    // AIは先頭から順番に割る
    for(var bi=0;bi<actual;bi++){
      oppBreakMyShield(intactIdxs[bi]);
    }
    // G・ブレイカー：相手（自分）のシールドも割る
    if(oppBc.type==='g'){
      var oppIntact=[];
      for(var i=0;i<G.oppShields.length;i++) if(G.oppShields[i].intact) oppIntact.push(i);
      if(oppIntact.length>0){
        log('l','⚡ G・ブレイカー：相手自身のシールドも全て割れる！');
        for(var i=0;i<oppIntact.length;i++) _doBreakOne(oppIntact[i]);
      }
    }
  }
}

function oppBreakMyShield(idx){
  var sh=G.myShields[idx];
  if(!sh||!sh.intact) return;
  G.myShields[idx].intact=false;
  var rem=0; for(var i=0;i<G.myShields.length;i++) if(G.myShields[i].intact) rem++;
  G.myHand.push({id:sh.card.id,name:sh.card.name,cost:sh.card.cost,pow:sh.card.pow,type:sh.card.type,civ:sh.card.civ,icon:sh.card.icon,eff:sh.card.eff,uid:nuid(),twin:sh.card.twin||false,spellName:sh.card.spellName||'',spellCost:sh.card.spellCost||0,spellEff:sh.card.spellEff||''});
  log('l','💔 シールドブレイク「'+sh.card.name+'」手札へ（残'+rem+'）');
  fxFlash(); shakeShield('msh',idx);
  // S・トリガー
  if(sh.card.eff&&sh.card.eff.indexOf('S・トリガー')!==-1){
    log('w','🛡 S・トリガー「'+sh.card.name+'」発動！'); spellEff(sh.card,true);
  }
  // G・ストライク
  if(sh.card.eff&&sh.card.eff.indexOf('G・ストライク')!==-1&&G.oppBattle.length>0){
    var gsOpts=G.oppBattle.map(function(x){return{label:x.name+'（P:'+x.pow+'）',cls:''};});
    gsOpts.push({label:'✋ G・ストライクを使わない',cls:'no'});
    showPopup('G・ストライク！','「'+sh.card.name+'」\n相手クリーチャーを1体選ぶ。\nこのターン攻撃不可にする。',gsOpts,function(gidx){
      if(gidx===gsOpts.length-1){log('w','🛡 G・ストライク：使用しない');return;}
      G.oppBattle[gidx].tapped=true;
      log('w','🛡 G・ストライク：「'+G.oppBattle[gidx].name+'」このターン攻撃不可！');
    });
  }
  // S・バック
  if(sh.card.civ==='d'){
    var sbSpells=G.myHand.filter(function(x){return x.type==='spell'&&x.eff&&x.eff.indexOf('S・バック')!==-1;});
    if(sbSpells.length>0){
      showCardSelectPopup(
        'S・バック',
        '「'+sh.card.name+'」（闇）をシールドから手札に加えた。\nそのカードを捨てて、S・バック持ち呪文をコスト0で唱えてもよい。',
        sbSpells,
        function(sel){
          if(!sel){log('w','🛡 S・バック：使わない');return;}
          G.myHand=G.myHand.filter(function(x){return x.uid!==sh.card.uid;});
          G.grave.push(sh.card);
          G.myHand=G.myHand.filter(function(x){return x.uid!==sel.uid;});
          G.grave.push(sel);
          log('w','🛡 S・バック：「'+sh.card.name+'」を捨てて「'+sel.name+'」を無料発動！');
          spellEff(sel,true);
        },
        {skipLabel:'✋ S・バックを使わない'}
      );
    }
  }
}

/* ══ プレイヤー操作 ══ */
function selCard(uid){
  if(G.over) return;
  G.sel=(G.sel===uid)?null:uid;
  // チャージフェイズ中にカードを選択したらタイマーキャンセル（チャージ意思あり）
  if(G.phase===2 && G.sel && G_chargeTimer){
    clearTimeout(G_chargeTimer);
    G_chargeTimer=null;
  }
  render(); updateBtns();
}
function getSelCard(){
  for(var i=0;i<G.myHand.length;i++) if(G.myHand[i].uid===G.sel) return G.myHand[i];
  for(var i=0;i<G.myBattle.length;i++) if(G.myBattle[i].uid===G.sel) return G.myBattle[i];
  return null;
}
function updateBtns(){
  var c=getSelCard();
  var inH=c&&G.myHand.filter(function(x){return x.uid===c.uid;}).length>0;
  var inB=c&&G.myBattle.filter(function(x){return x.uid===c.uid;}).length>0;
  var si=document.getElementById('g-selinfo');
  if(!c){
    if(si){si.textContent='カードを選択してください'; si.style.color='';}
    var _bsum=document.getElementById('b-sum');if(_bsum)_bsum.disabled=true;
    var _bmna=document.getElementById('b-mna');if(_bmna)_bmna.disabled=true;
    var _batk=document.getElementById('b-atk');if(_batk)_batk.disabled=true;
    return;
  }
  var ec=G_testMode ? 0 : Math.max(0,(c.twin?Math.min(c.cost,c.spellCost||c.cost):c.cost)-G.costBonus);
  if(si) si.innerHTML='<b>'+c.name+'</b>'+(c.twin?' <span style="font-size:.55rem;color:#aa88ff;">[ツインパクト]</span>':'')+'｜コスト'+(G_testMode?'<span style="color:#ff9900;">0(test)</span>':ec)+(c.pow>0?'｜P:'+c.pow.toLocaleString():'');
  if(si) si.style.color='var(--gold)';
  var av=G_testMode ? 999 : 0; if(!G_testMode) for(var i=0;i<G.myMana.length;i++) if(!G.myMana[i].tapped) av++;
  var bSum=document.getElementById('b-sum'); if(bSum) bSum.disabled=!(inH&&G.phase===3&&av>=ec);
  var bMna=document.getElementById('b-mna'); if(bMna) bMna.disabled=!(inH&&G.phase===2&&!G.charged);
  // チャージフェイズでは召喚・攻撃を完全ロック
  if(G.phase===2){
    if(bSum) bSum.disabled=true;
    var bAtk0=document.getElementById('b-atk'); if(bAtk0) bAtk0.disabled=true;
    return;
  }
  // 攻撃可否チェック
  var isMachFighter=hasAbility(c,'マッハファイター')&&c.summoned;
  var isSA=hasAbility(c,'スピードアタッカー');
  var isAbyssRush=!!c.abyssRush;
  var canMoveWithSick=isSA||isMachFighter||isAbyssRush;
  var baseCanAtk=inB&&!c.tapped&&G.phase===4&&(!c.summoned||canMoveWithSick);
  var canAtk=false;
  if(baseCanAtk){
    if(isAbyssRush){
      // アビスラッシュはプレイヤーのみ攻撃可
      canAtk=true;
    } else {
      var tappedEnemies=G.oppBattle.filter(function(x){return x.tapped;});
      var attackableEnemies=isMachFighter?G.oppBattle:tappedEnemies;
      var canAttackShield=!c.summoned||(isSA&&!isMachFighter);
      canAtk=(attackableEnemies.length>0||canAttackShield);
    }
  }
  var bAtk=document.getElementById('b-atk'); if(bAtk) bAtk.disabled=!canAtk;
}
function doAbyssRushCard(sel){
  if(isLocked()) return;
  if(G.phase!==3){log('l','メインフェイズ以外ではアビスラッシュできません');return;}
  G.grave=G.grave.filter(function(x){return x.uid!==sel.uid;});
  var instance=makeCard(sel, {abyssRush:true, endOfTurn:'toBottom'});
  G.myBattle.push(instance);
  log('w','🌑 アビスラッシュ：「'+sel.name+'」を墓地から召喚！このターンプレイヤーへの攻撃可・ターン終了時山札の下へ（クリーチャー攻撃不可）');
  fxFloat('ラッシュ！','#ff6699');
  graveFx(instance, function(){
    myEnteredEff(instance, 'abyssRush');
  });
  render(); updateBtns();
}
function doGraveSpellCard(sel){
  if(isLocked()) return;
  if(G.phase!==3){log('l','メインフェイズ以外では使えません');return;}
  var ec=G_testMode?0:Math.max(0,sel.cost-G.costBonus);
  var av=G_testMode?999:0; if(!G_testMode) for(var i=0;i<G.myMana.length;i++) if(!G.myMana[i].tapped) av++;
  if(av<ec){log('l','マナが足りません（コスト'+ec+'）');return;}
  var paid=0;

  G.grave=G.grave.filter(function(x){return x.uid!==sel.uid;});
  G.myDeck.unshift(sel);

  graveFx(sel, function(){
    var eff=CARD_EFFECTS[sel.id];

}
function doAbyssRush(){

function doGraveSpell(){

}
/* ══ カードを直接プレイ（ポップアップボタンから呼ぶ） ══ */
function chargeCardDirect(c){
  if(G.phase!==2){log('l','チャージフェイズ以外ではチャージできません');return;}
  if(G.charged){log('l','1Tに1枚しかチャージできません');return;}
  G.myHand=G.myHand.filter(function(x){return x.uid!==c.uid;});
  var _isMul=(c.civ==='m');
  G.myMana.push({civ:_isMul?'nd':c.civ,tapped:_isMul,name:c.name,id:c.id,cost:c.cost,pow:c.pow,type:c.type,icon:c.icon,eff:c.eff});
  if(_isMul) log('s','⚠️ 多色カードはタップ状態で置かれます');
  G.charged=true;
  log('s','🌿「'+c.name+'」マナチャージ（計'+G.myMana.length+'マナ）');
  G.sel=null; render(); updateBtns();
  safeTimeout(function(){G.phase=3;runPhase();},350);
}
function playCardDirect(c, asSpell, ec){
  if(isLocked()) return;
  if(G.phase!==3){log('l','メインフェイズ以外では使えません');return;}
  // マナを支払う
  var paid=0;
  if(!G_testMode) for(var i=0;i<G.myMana.length;i++){if(!G.myMana[i].tapped&&paid<ec){G.myMana[i].tapped=true;paid++;}}
  G.costBonus=0;
  G.myHand=G.myHand.filter(function(x){return x.uid!==c.uid;});
  G.sel=null;
  if(!asSpell && c.type==='creature'){
    // クリーチャーとして召喚
    var instance=makeCard(c, {uid:c.uid, summoned:true});
    G.myBattle.push(instance);
    log('a','⚔️「'+c.name+'」召喚！（コスト'+ec+'）');
    fxFloat('召喚！','#88ff88');
    render();
    enterFx(instance, function(){
      myEnteredEff(instance, 'summon');
    });
  } else if(asSpell && c.twin){
    // ツインパクトの呪文面
    G.grave.push(Object.assign({},c,{usedAsSpell:true}));
    log('m','💫「'+c.spellName+'」発動！（コスト'+ec+'）');
    fxFloat('呪文！','#88aaff');
    var spellCard={id:c.id,name:c.spellName,cost:c.spellCost,pow:0,type:'spell',civ:c.civ,icon:c.icon,eff:c.spellEff,uid:c.uid};
    spellEff(spellCard,true);
  } else {
    // 通常呪文
    G.grave.push(c);
    log('m','💫「'+c.name+'」発動！（コスト'+ec+'）');

/* ══════════════════════════════════════════
   makeCard(base, opts)
   カードインスタンスを生成するファクトリ関数
   base : カードデータ（手札・デッキ・墓地のオブジェクト）
   opts : 状態フラグ（省略可）
     uid       : 指定がなければ nuid() で自動発行
     tapped    : タップ状態（default: false）
     summoned  : 召喚酔いフラグ（default: false）
     sealed    : 封印中（default: false）
     abyssRush : アビスラッシュで出た（default: false）
     attacked  : そのターンに攻撃したか（default: false）、アンタップ時にリセット
     endOfTurn : ターン終了時の処理
                 null                 = 何もしない
                 'toBottom'           = 無条件で山札の下へ（通常アビスラッシュ）
                 'toBottomIfAttacked' = 攻撃した場合のみ山札の下へ（ジャガイスト経由）
   ══════════════════════════════════════════ */
function makeCard(base, opts){
  opts = opts || {};
  return {
    // 基本情報
    id:        base.id        || '',
    name:      base.name      || '',
    cost:      base.cost      || 0,
    pow:       base.pow       || 0,
    basePow:   base.pow       || 0,  // 常在効果によるパワー変動前の基準値
    type:      base.type      || 'creature',
    civ:       base.civ       || 'd',
    icon:      base.icon      || '🃏',
    eff:       base.eff       || '',
    race:      base.race      || '',
    twin:      base.twin      || false,
    spellName: base.spellName || '',
    spellCost: base.spellCost || 0,
    spellEff:  base.spellEff  || '',
    // 状態フラグ
    uid:       opts.uid       !== undefined ? opts.uid : nuid(),
    tapped:    opts.tapped    || false,
    summoned:  opts.summoned  || false,
    sealed:    opts.sealed    || false,
    abyssRush: opts.abyssRush || false,
    attacked:  opts.attacked  || false,
    endOfTurn: opts.endOfTurn || null,
    grantedAbilities: [], // [{ability:'マッハファイター', from:'uid'}, ...]
  };
}

/* ══════════════════════════════════════════
   能力付与ユーティリティ
   grantAbility(target, ability, fromUid)
     target  : 付与対象のカードインスタンス
     ability : 付与する能力文字列
     fromUid : 付与元カードのuid（applyPermanentEffectsでリセットされるため剥奪不要）
   ══════════════════════════════════════════ */
function grantAbility(target, ability, fromUid){
  if(!target.grantedAbilities) target.grantedAbilities=[];
  // 同じ付与元から同じ能力が既にある場合は重複しない
  for(var i=0;i<target.grantedAbilities.length;i++){
    if(target.grantedAbilities[i].ability===ability && target.grantedAbilities[i].from===fromUid) return;
  }
  target.grantedAbilities.push({ability:ability, from:fromUid});
}

/* ══════════════════════════════════════════
   hasAbility(c, ability)
   カードがある能力を持っているか判定する共通関数
   ① 自身のeffテキストに書いてある
   ② 場の常在型付与効果でもらっている
   ══════════════════════════════════════════ */
function hasAbility(c, ability){
  // ① 自身のeffテキストチェック
  if(c.eff && c.eff.indexOf(ability) !== -1) return true;

  // ② 付与された能力チェック
  if(c.grantedAbilities){
    for(var i=0;i<c.grantedAbilities.length;i++){
      if(c.grantedAbilities[i].ability===ability) return true;
    }
  }

  return false;
}
