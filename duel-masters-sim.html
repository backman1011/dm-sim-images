/* ══ イベントバス ══
   fireEvent(eventType, eventData)
   場にいる全カードをスキャンし、eventTypeに反応するカードをキューに積む。
   現在対応するイベント：
     'onTurnEnd'      : ターン終了時
     'onOppSummon'    : 相手がクリーチャーを召喚した時  eventData={card}
     'onOtherEntered' : 自分のクリーチャーが場に出た時  eventData={card, playType}
   ※ 手札・墓地からの誘発は今後必要になった時に拡張
*/
function fireEvent(eventType, eventData){
  var snapshot = G.myBattle.slice(); // スナップショットで順番固定
  for(var i=0; i<snapshot.length; i++){
    var c = snapshot[i];
    // onOtherEnteredは自分自身には反応しない
    if(eventType==='onOtherEntered' && eventData.card && c.uid===eventData.card.uid) continue;
    var eff = CARD_EFFECTS[c.id];
    if(!eff || !eff[eventType]) continue;
    // shouldFire関数があれば積む前に条件チェック
    if(eff[eventType+'_check'] && !eff[eventType+'_check'](c, eventData)) continue;
    // ラベルを_labelから引く、なければデフォルト
    var label = (eff[eventType+'_label']
      ? '「'+c.name+'」'+eff[eventType+'_label']
      : '「'+c.name+'」の誘発効果');
    // ターン開始/終了時効果は解決順選択をスキップ
    var skipOrder = (eventType==='onTurnStart' || eventType==='onTurnEnd');
    (function(card, effect, data, lbl, skip){
      queueTrigger(
        lbl,
        card.uid,
        function(done){
          if(G.myBattle.filter(function(x){return x.uid===card.uid;}).length===0){done();return;}
          flashCard(card.uid, function(){
            render();
            effect[eventType](card, data, done);
          });
        },
        {skipOrderSelect: skip}
      );
    })(c, eff, eventData, label, skipOrder);
  }
}
/* ══ playType 定義 ══
   'summon'     : 手札からコストを払って召喚          → onEntered + onSummon
   'abyssRush'  : 墓地からコストを払って召喚          → onEntered + onSummon
   'mekleido'   : メクレイドで出る（実行扱い）         → onEntered + onSummon
   'reani'      : リアニメイト（踏み倒し）             → onEntered のみ
   'yobinion'   : ヨビニオン（踏み倒し）               → onEntered のみ
   'abyssbell'  : アビスベル効果（踏み倒し）           → onEntered のみ
   'jagaisuto'  : ジャガイスト効果（踏み倒し）         → onEntered のみ
══ */
/* 召喚によって場に出た（onSummon発動対象）か判定 */
function isSummonPlay(playType){
  return playType==='summon' || playType==='abyssRush' || playType==='mekleido';
}

/* ══ 効果ディスパッチャー ══ */
/* ══ 誘発効果キューシステム ══ */
var G_triggerQueue = [];
var G_triggerQueueOnComplete = null; // キュー全解決後のコールバック
var G_triggerResolving = false;      // キュー解決中フラグ

function queueTrigger(label, cardUid, fn, opts){
  G_triggerQueue.push({label:label, cardUid:cardUid, fn:fn, skipOrderSelect:!!(opts&&opts.skipOrderSelect)});
}

/* キューの先頭に割り込んで即実行（解決順選択をスキップ） */
function queueTriggerNext(label, cardUid, fn){
  G_triggerQueue.unshift({label:label, cardUid:cardUid, fn:fn, skipOrderSelect:true});
}

function resolveTriggerQueue(onComplete){
  if(onComplete) G_triggerQueueOnComplete = onComplete;
  if(G_triggerResolving) return;
  _nextTrigger();
}

function _nextTrigger(){
  if(G_triggerQueue.length===0){
    G_triggerResolving = false;
    var cb = G_triggerQueueOnComplete;
    G_triggerQueueOnComplete = null;
    if(cb) cb();
    return;
  }
  // 先頭がskipOrderSelectなら即実行
  if(G_triggerQueue[0].skipOrderSelect){
    _execTrigger();
    return;
  }
  // 2つ以上同時誘発：解決順を選択
  if(G_triggerQueue.length>=2){
    // skipOrderSelectでないものだけ選択肢に出す
    var selectable = G_triggerQueue.filter(function(e){return !e.skipOrderSelect;});
    if(selectable.length>=2){
      var choices=selectable.map(function(e){return {label:e.label,cls:''};});
      showPopup('効果の解決順を選択',
        '複数の効果が同時に誘発しました。どちらから解決しますか？',
        choices,
        function(idx){
          var chosen=selectable[idx];
          G_triggerQueue=G_triggerQueue.filter(function(e){return e!==chosen;});
          G_triggerQueue.unshift(chosen);
          _execTrigger();
        }
      );
      return;
    }
  }
  _execTrigger();
}

function _execTrigger(){
  if(G_triggerQueue.length===0){ _nextTrigger(); return; }
  G_triggerResolving = true;
  var entry=G_triggerQueue.shift();
  G_popupSourceUid=entry.cardUid;
  render();
  entry.fn(function(){
    // done()が呼ばれた→この効果は完了。次へ
    G_popupSourceUid=null;
    render();
    // G_triggerResolvingはtrueのまま_nextTriggerへ
    // （解決中に積まれた新しい効果もここで続けて処理される）
    _nextTrigger();
  });
}

/* 後方互換 */
function executeNextTrigger(){ _execTrigger(); }

/* myEnteredEff(c, playType)
   playType : 上記定義を参照。省略時は'reani'扱い（onEnteredのみ）
*/
function myEnteredEff(c, playType){
  // 後方互換：旧 isSummon=true/false をplayTypeに変換
  if(playType===true)  playType='summon';
  if(playType===false || playType===undefined || playType===null) playType='reani';

  if(c.type==='creature'){
    G.turnCreatureCount=(G.turnCreatureCount||0)+1;
  }

  // onEntered をキューに積む（全playTypeで発動）
  var eff=CARD_EFFECTS[c.id];
  if(eff&&eff.onEntered){
    (function(card, effect){
      var lbl = effect.onEntered_label
        ? '「'+card.name+'」'+effect.onEntered_label
        : '「'+card.name+'」の出た時効果';
      queueTrigger(
        lbl,
        card.uid,
        function(done){
          flashCard(card.uid, function(){
            render();
            effect.onEntered(card, done);
          });
        }
      );
    })(c, eff);
  }

  // ティンパニ2体目チェックをキューに積む
  if(c.type==='creature'&&G.turnCreatureCount===2&&c.id!=='tinpani'){
    var tinpanis=G.myBattle.filter(function(x){return x.id==='tinpani';});
    if(tinpanis.length>0){
      (function(tp, cnt){
        queueTrigger(
          '「'+tp.name+'」の誘発効果（'+cnt+'体目）',
          tp.uid,
          function(done){
            flashCard(tp.uid, function(){
              showPopup('ティンパニ=シンバリー',
                '自分の'+cnt+'体目のクリーチャーが出た！\nティンパニを破壊してもよい。\nそうしたら相手はクリーチャー1体を選び破壊する。',
                [{label:'⚡ ティンパニを自壊させる',cls:'yes'},{label:'✋ 発動しない',cls:'no'}],
                function(ti){
                  if(ti===1){log('w','💠 ティンパニ：発動しない');done();return;}
                  G.myBattle=G.myBattle.filter(function(x){return x.uid!==tp.uid;});G.grave.push(tp);
                  log('w','💠 ティンパニ：自壊！相手はクリーチャーを1体選んで破壊する');
                  if(G.oppBattle.length>0){
                    showCardSelectPopup('ティンパニ効果','相手はクリーチャーを1体選んで破壊する。',G.oppBattle,function(sel){
                      if(!sel){done();return;}
                      G.oppBattle=G.oppBattle.filter(function(x){return x.uid!==sel.uid;});G.oppGrave.push(sel);
                      log('l','💀 ティンパニ効果：「'+sel.name+'」破壊！');render();
                      done();
                    });
                  } else {
                    done();
                  }
                  render();
                }
              );
            });
          }
        );
      })(tinpanis[0], G.turnCreatureCount);
    }
  }

  // onSummon をキューに積む（召喚扱いのplayTypeのみ）
  if(isSummonPlay(playType)){
    var effS=CARD_EFFECTS[c.id];
    if(effS&&effS.onSummon){
      (function(card, es){
        var lbl = es.onSummon_label
          ? '「'+card.name+'」'+es.onSummon_label
          : '「'+card.name+'」の召喚時効果';
        queueTrigger(
          lbl,
          card.uid,
          function(done){
            flashCard(card.uid, function(){
              render();
              es.onSummon(card, done);
            });
          }
        );
      })(c, effS);
    }
  }

  // 場にいる他のカードの誘発をチェック（ジャガイスト等）
  if(c.type==='creature'){
    fireEvent('onOtherEntered', {card:c, playType:playType});
  }

  // 常にresolveTriggerQueueを呼ぶ
  // 解決中なら積むだけで、done()後に自動で続きが処理される
  resolveTriggerQueue();
}
function mySummonEff(c){
  // 統合済み。myEnteredEff(c, 'summon') で onSummon まで処理される
}

function spellEff(c,isMe){
  if(!isMe){render();return;}
  spellFx(c, function(){
    var eff=CARD_EFFECTS[c.id];
    if(eff&&eff.onSpell){
      G_popupSourceUid=c.uid;

}

function oppSummonEff(c){

  fireEvent('onOppSummon', {card:c});

}

/* ══ 手札から捨てる共通処理 ══
   discardFromHand(card, who)
   who: 'my'=自分の手札から / 'opp'=相手の手札から
   手札から墓地に移動し、fireEvent('onDiscard')を発火する
*/
function discardFromHand(card, who, callback){
  var cb = callback || function(){};
  if(who==='my'){
    G.myHand = G.myHand.filter(function(x){return x.uid!==card.uid;});
    G.grave.push(card);
  } else {
    G.oppHand = G.oppHand.filter(function(x){return x.uid!==card.uid;});
    G.oppGrave.push(card);
  }
  render();
  // ハンデスFxを再生してからテレスのドロー選択・callback
  discardFx(card, who, function(){
    if(who==='opp'){
      var teresuList = G.myBattle.filter(function(x){return x.id==='teresu';});
      if(teresuList.length > 0 && G.myDeck.length > 0){
        function doNextDraw(idx){
          if(idx >= teresuList.length){ cb(); return; }
          if(G.myDeck.length === 0){ cb(); return; }
          var t = teresuList[idx];
          flashCard(t.uid, function(){
            showYesNo(
              '謀遠 テレスコ=テレス',
              '相手が手札を捨てた。1枚引く？',
              function(yes){
                if(yes){ myDraw(true); log('w','🌑 テレス：1枚ドロー'); }
                else { log('w','🌑 テレス：ドローしない'); }
                doNextDraw(idx+1);
              }
            );
          });
        }
        doNextDraw(0);
        return;
      }
    }
    cb();
  });
}

/* ══ アビス・メクレイド5 ══ */
function execMekleido5(isMe, callback){
  var cb = callback || function(){};
  var deck = isMe ? G.myDeck : G.oppDeck;
  if(deck.length===0){log('w','メクレイド5：山札なし');cb();return;}
  // 上から3枚を見る
  var top3=[];
  for(var i=0;i<3&&deck.length>0;i++) top3.push(deck.pop());
  var abyssIds=ABYSS_IDS;
  var targets=top3.filter(function(x){return x.cost<=5&&abyssIds.indexOf(x.id)>=0;});
  var rest=top3.filter(function(x){return targets.indexOf(x)<0;});
  log('w','🌑 メクレイド5：山札上3枚=['+(top3.map(function(x){return x.name+'('+x.cost+')';}).join(',')||'なし')+'] 対象='+targets.length+'枚');
  if(isMe){
    if(targets.length===0){
      // 対象なしでも3枚を見せてから山札の下へ
      var displayNone=top3.map(function(x){return Object.assign({},x,{_disabled:true});});
      showCardSelectPopup(
        'アビス・メクレイド5',
        '山札上3枚を確認。コスト5以下のアビスなし。\n残りは山札の下へ。',
        displayNone,
        function(){
          for(var i=top3.length-1;i>=0;i--) deck.unshift(top3[i]);
          render(); cb();
        },
        {skipLabel:'✅ 確認（山札の下へ）'}
      );
      return;
    }
    // top3全体を表示（アビス以外はdisabled）
    var displayList=top3.map(function(x){
      var isTarget=targets.indexOf(x)>=0;
      return Object.assign({},x,{_disabled:!isTarget});
    });
    showCardSelectPopup(
      'アビス・メクレイド5',
      '山札上3枚を確認。コスト5以下のアビスを\n1体タダ召喚。残りは山札の下へ。\n（暗いカードは選択不可）',
      displayList,
      function(sel){
        var putBack = sel ? top3.filter(function(x){return x.uid!==sel.uid;}) : top3;
        for(var i=putBack.length-1;i>=0;i--) deck.unshift(putBack[i]);
        if(!sel){log('w','🌑 メクレイド5：使わない');render();cb();return;}
        log('w','🌑 メクレイド5：「'+sel.name+'」をタダ召喚！');
        if(sel.type==='creature'){
          var instance=makeCard(sel, {summoned:true});
          G.myBattle.push(instance);
          render();
          enterFx(instance, function(){
            myEnteredEff(instance, 'mekleido');
            cb();
          });
        } else {
          G.grave.push(sel);
          spellEff(sel,true);
          cb();
        }
        render();
      },
      {skipLabel:'✋ 使わない'}
    );
  } else {
    // AI：コスト5以下の最高コストアビスを自動で選ぶ
    if(targets.length>0){
      targets.sort(function(a,b){return b.cost-a.cost;});
      var chosen=targets[0];
      var putBack=top3.filter(function(x){return x.uid!==chosen.uid;});
      for(var i=putBack.length-1;i>=0;i--) deck.unshift(putBack[i]);
      log('l','相手メクレイド5：「'+chosen.name+'」タダ召喚！');
      if(chosen.type==='creature'){
        G.oppBattle.push(makeCard(chosen, {summoned:true}));
        oppSummonEff(chosen);
      }
    } else {
      for(var i=top3.length-1;i>=0;i--) deck.unshift(top3[i]);
    }
    cb();
  }
}

/* ══ カード選択ポップアップ ══
   showCardSelectPopup(title, desc, cards, callback, opts)
   cards: [{id, name, cost, pow, civ, icon, eff, ...}] カードオブジェクト
   callback(selectedCard) or callback(null) でキャンセル/スキップ
   opts: { skipLabel: 'スキップラベル文字列' or null（スキップ不可） }
*/
var G_cardSelCallback = null;
var G_cardSelSelected = null; // 単数選択用（後方互換）
var G_cardSelMulti = [];      // 複数選択用
var G_cardSelMax = 1;         // 最大選択数
var G_cardSelCards = [];

function showCardSelectPopup(title, desc, cards, callback, opts){
  G_popupWaiting=true;
  render(); // effingクラスを反映
  opts = opts || {};
  G_cardSelCallback = callback;
  G_cardSelSelected = null;
  G_cardSelMulti = [];
  G_cardSelMax = opts.maxSelect || 1;
  G_cardSelCards = cards;

  document.getElementById('csp-title').textContent = title;
  document.getElementById('csp-desc').textContent = desc || '';

  var container = document.getElementById('csp-cards');
  container.innerHTML = '';

  function updateConfirmBtn(){
    var ok = G_cardSelMulti.length === G_cardSelMax;
    document.getElementById('csp-confirm').disabled = !ok;
    document.getElementById('csp-title').textContent = title +
      (G_cardSelMax>1 ? '（'+G_cardSelMulti.length+'/'+G_cardSelMax+'枚選択）' : '');
  }

  // カード一覧を描画
  cards.forEach(function(c, i){
    if(c._header){
      var h=document.createElement('div');
      h.style.cssText='width:100%;font-size:.58rem;color:var(--muted);letter-spacing:.1em;padding:4px 2px 2px;margin-top:2px;border-top:1px solid var(--bdr);flex-basis:100%;';
      h.textContent=c.name; container.appendChild(h); return;
    }
    var d = document.createElement('div');
    if(c._disabled){
      d.className = 'csp-card';
      d.style.cssText='opacity:.3;filter:grayscale(.8);cursor:not-allowed;';
      if(CARD_IMAGES[c.id]) d.innerHTML='<img src="'+CARD_IMAGES[c.id]+'" alt="'+c.name+'"><div class="csp-card-name">'+c.name+'</div>';
      else{ var cb2={n:'#1a3a1a',d:'#1a0a2e',m:'linear-gradient(135deg,#1a3a1a,#1a0a2e)'}; d.innerHTML='<div class="csp-card-icon" style="background:'+(cb2[c.civ]||'#111')+';">'+(c.icon||'🃏')+'</div><div class="csp-card-name">'+c.name+'</div>'; }
      (function(card){bindDoubleTap(d,function(e){e.stopPropagation();openCardModal(card);});})(c);
      container.appendChild(d); return;
    }
    d.className = 'csp-card';
    if(CARD_IMAGES[c.id]) d.innerHTML='<img src="'+CARD_IMAGES[c.id]+'" alt="'+c.name+'"><div class="csp-card-name">'+c.name+'</div>';
    else{ var cb3={n:'#1a3a1a',d:'#1a0a2e',m:'linear-gradient(135deg,#1a3a1a,#1a0a2e)'}; d.innerHTML='<div class="csp-card-icon" style="background:'+(cb3[c.civ]||'#111')+';">'+(c.icon||'🃏')+'</div><div class="csp-card-name">'+c.name+'</div>'; }
    (function(idx, card, el){
      el.onclick = function(){
        if(G_cardSelMax===1){
          // 単数選択（従来通り）
          var all=document.getElementsByClassName('csp-card');
          for(var j=0;j<all.length;j++) all[j].classList.remove('selected');
          el.classList.add('selected');
          G_cardSelSelected=card; G_cardSelMulti=[card];
        } else {
          // 複数選択
          var idx2=G_cardSelMulti.indexOf(card);
          if(idx2>=0){
            G_cardSelMulti.splice(idx2,1);
            el.classList.remove('selected');
          } else {
            if(G_cardSelMulti.length>=G_cardSelMax) return; // 上限
            G_cardSelMulti.push(card);
            el.classList.add('selected');
          }
          G_cardSelSelected=G_cardSelMulti[0]||null;
        }
        updateConfirmBtn();
      };
      bindDoubleTap(el,function(e){e.stopPropagation();openCardModal(card);});
    })(i, c, d);
    container.appendChild(d);
  });

  if(opts.skipLabel){
    var skip=document.createElement('div'); skip.className='csp-card skip-btn'; skip.textContent=opts.skipLabel;
    skip.onclick=function(){
      document.getElementById('card-sel-popup').className='';G_popupWaiting=false;
      var cb=G_cardSelCallback; G_cardSelCallback=null; G_cardSelSelected=null; G_cardSelMulti=[];
      cb(null); render(); updateBtns();
    };
    container.appendChild(skip);
  }

  document.getElementById('csp-confirm').disabled=true;
  document.getElementById('csp-prev-name').textContent='カードを選んでください';
  document.getElementById('csp-prev-eff').textContent='';
  document.getElementById('csp-prev-img').innerHTML='<div class="no-img">🃏</div>';
  document.getElementById('card-sel-popup').className='open';
}

function updateCspPreview(c){
  var nameEl=document.getElementById('csp-prev-name');
  var effEl=document.getElementById('csp-prev-eff');
  var imgEl=document.getElementById('csp-prev-img');
  nameEl.textContent=c.name+'　コスト'+c.cost+(c.pow>0?'　P:'+c.pow:'　呪文');
  effEl.textContent=c.eff||'';
  if(CARD_IMAGES[c.id]) imgEl.innerHTML='<img src="'+CARD_IMAGES[c.id]+'" alt="'+c.name+'">';
  else imgEl.innerHTML='<div class="no-img">'+(c.icon||'🃏')+'</div>';
}

function confirmCardSel(){
  var result=G_cardSelMax>1?G_cardSelMulti:G_cardSelSelected;
  if(!result||(Array.isArray(result)&&result.length===0)) return;
  document.getElementById('card-sel-popup').className='';
  G_popupWaiting=false;
  var cb=G_cardSelCallback;
  G_cardSelCallback=null; G_cardSelSelected=null; G_cardSelMulti=[];
  cb(result);
  render(); updateBtns();
}

function cancelCardSel(){
  document.getElementById('card-sel-popup').className = '';
  G_popupWaiting=false;
  if(G_cardSelCallback){
    var cb = G_cardSelCallback;
    G_cardSelCallback = null;
    G_cardSelSelected = null;
    cb(null);
    render(); updateBtns();
  }
}

function doAttack(){
  if(isLocked()) return;
  var c=null; for(var i=0;i<G.myBattle.length;i++) if(G.myBattle[i].uid===G.sel){c=G.myBattle[i];break;}
  if(!c||c.tapped) return;

  var hasMachFighter=hasAbility(c,'マッハファイター')&&c.summoned;
  var hasSA=hasAbility(c,'スピードアタッカー');
  var hasAbyssRush=!!c.abyssRush;

  // 召喚酔いチェック
  if(c.summoned){
    if(!hasSA&&!hasMachFighter&&!hasAbyssRush){log('l','⚠️「'+c.name+'」は召喚酔いのため攻撃できません');return;}
    if(!hasSA&&hasMachFighter&&G.oppBattle.length===0){log('l','⚠️ マッハファイターはクリーチャーがいない場合シールドへ攻撃できません');return;}
  }

  // 攻撃先の選択肢を構築
  // タップしている相手クリーチャー（通常攻撃可能）
  var tappedEnemies=G.oppBattle.filter(function(x){return x.tapped;});
  // マッハファイター（出たターンのみ）はアンタップも対象
  // アビスラッシュはプレイヤーのみ攻撃可（クリーチャーには攻撃不可）
  var attackableEnemies=hasAbyssRush ? [] : (hasMachFighter ? G.oppBattle : tappedEnemies);
  // シールドへの攻撃：召喚酔いなし or SA or アビスラッシュ → 可。マッハファイター中（召喚酔い中）は不可
  var canAttackShield = !c.summoned || (hasSA && !hasMachFighter) || hasAbyssRush;

  // ブレイク数を判定
  var intactShieldsAll=[];
  for(var i=0;i<G.oppShields.length;i++) if(G.oppShields[i].intact) intactShieldsAll.push(i);
  var bcOptions=calcBreakOptions(c, intactShieldsAll.length);
  var bc=bcOptions.reduce(function(max,o){return o.count>max.count?o:max;},bcOptions[0]);
  var breakCount=Math.min(bc.count, intactShieldsAll.length||1);

  // 攻撃先選択ポップアップを構築
  var opts=[];

  // クリーチャー攻撃選択肢（攻撃可能なもの全部）
  for(var i=0;i<attackableEnemies.length;i++){
    var e=attackableEnemies[i];
    opts.push({label:'⚔️ '+e.name+'（P:'+e.pow+'）'+(e.tapped?' [タップ]':''),cls:'',uid:e.uid,type:'creature'});
  }

  // プレイヤー攻撃選択肢
  if(canAttackShield){
    var intactShields=intactShieldsAll;
    if(intactShields.length>0){
      if(bcOptions.length>1){
        // 509.2c：複数ブレイカー能力がある場合、プレイヤーが選択
        // ただし1枚以下は選べないため最小の能力が下限
        var minCount=bcOptions.reduce(function(min,o){return o.count<min.count?o:min;},bcOptions[0]).count;
        for(var bi=0;bi<bcOptions.length;bi++){
          var bco=bcOptions[bi];
          var actualBreak=Math.min(bco.count, intactShields.length);
          opts.push({
            label:'🛡 プレイヤーを攻撃（'+BREAKER_LABEL[bco.type]+' / '+actualBreak+'枚）',
            cls:'yes',type:'player',
            intactShields:intactShields,breakCount:actualBreak,
            hasCreature:attackableEnemies.length>0,bcType:bco.type
          });
        }
      } else {
        var actualBreak=Math.min(breakCount, intactShields.length);
        var breakLabel = bc.type==='single'
          ? '🛡 プレイヤーを攻撃（シールド残'+intactShields.length+'枚）'
          : '🛡 プレイヤーを攻撃（'+BREAKER_LABEL[bc.type]+' / '+actualBreak+'枚）';
        opts.push({label:breakLabel,cls:'yes',type:'player',intactShields:intactShields,breakCount:actualBreak,hasCreature:attackableEnemies.length>0,bcType:bc.type});
      }
    } else {
      opts.push({label:'💥 ダイレクトアタック！',cls:'yes',type:'direct'});
    }
  }

  if(opts.length===0){
    log('l','⚠️ 攻撃できる対象がありません');
  } else if(opts.length===1 && opts[0].type==='direct'){
    execAttack(c,opts[0]);
  } else {
    var popTitle = '「'+c.name+'」の攻撃先を選ぶ';
    if(bcOptions.length>1) popTitle+=' （ブレイカー能力を選択）';
    else if(bc.type!=='single') popTitle+=' （'+BREAKER_LABEL[bc.type]+'）';
    showPopup(popTitle,'',opts,function(idx){ execAttack(c,opts[idx]); });
  }
}

function execAttack(c,target){
  c.tapped=true;
  c.attacked=true; // 攻撃した事実を記録（アンタップされても保持）
  // アビスラッシュカードが攻撃完了時：tapped済みなのでendTurnで山札の下へ（フラグはabyssRushで管理）
  G_popupSourceUid=c.uid; // アタック中のカードを点滅表示

  // ブロッカーチェック（相手のアンタップブロッカーがいればブロック可能）
  var canBeBlocked = target.type==='creature' || target.type==='player';
  var isUnblockable = c.eff && c.eff.indexOf('ブロックされない')!==-1;
  var oppBlockers = G.oppBattle.filter(function(x){
    return !x.tapped && !x.sealed && hasAbility(x,'ブロッカー');
  });

  if(canBeBlocked && !isUnblockable && oppBlockers.length>0){
    // 相手AIがブロックするか判定（パワーで勝てる or 相打ちならブロック）
    var willBlock = oppBlockers.filter(function(b){
      return b.pow >= c.pow;
    });
    if(willBlock.length>0){
      var blocker = willBlock[0];
      log('l','🛡 相手「'+blocker.name+'」がブロック！');
      blocker.tapped=true;
      battle(c, blocker, true);
      G.sel=null; render(); updateBtns();
      return;
    }
  }

  if(target.type==='creature'){
    var t=null; for(var i=0;i<G.oppBattle.length;i++) if(G.oppBattle[i].uid===target.uid){t=G.oppBattle[i];break;}
    if(!t){G.sel=null;render();updateBtns();return;}
    log('a','⚔️「'+c.name+'」('+c.pow+') → 「'+t.name+'」('+t.pow+')');
    battle(c,t,true);
    // シビルカウント3
    if(c.id==='maardan'){
      var darkCount=G.myBattle.filter(function(x){return x.civ==='d';}).length;
      if(darkCount>=3&&G.oppGrave.length>0){
        var gOpts=G.oppGrave.map(function(x){return{label:x.name+'（コスト'+x.cost+'）',cls:''};});
        gOpts.push({label:'✋ 使わない',cls:'no'});
        showPopup('シビルカウント3！','自分の闇が'+darkCount+'体！相手墓地のカードの出た時能力を使う。',gOpts,function(sidx){
          if(sidx===gOpts.length-1){log('w','🌑 シビルカウント：使わない');return;}
          var gc=G.oppGrave[sidx];
          log('w','🌑 シビルカウント：「'+gc.name+'」の能力発動！');
          myEnteredEff(gc);
          G.oppGrave=G.oppGrave.filter(function(x){return x.uid!==gc.uid;});
          G.oppDeck.unshift(gc);
          log('w','🌑「'+gc.name+'」を相手山札の下へ');
        });
      }
    }
  } else if(target.type==='player'){
    // プレイヤーへの攻撃 → 常に選択ポップアップ（シールドを選ぶ権利は攻撃側）
    breakShields(target.intactShields, target.breakCount, true);
    // G・ブレイカー：自分のシールドも全部割る
    if(target.bcType==='g'){
      var myIntact=[];
      for(var i=0;i<G.myShields.length;i++) if(G.myShields[i].intact) myIntact.push(i);
      if(myIntact.length>0){
        log('a','⚡ G・ブレイカー：自分のシールドも全て割れる！');
        for(var i=0;i<myIntact.length;i++) oppBreakMyShield(myIntact[i]);
      }
    }
  } else if(target.type==='direct'){
    log('a','🎉 ダイレクトアタック！'); fxFloat('ダイレクト！','#ff8844');
    endGame(true,c.name+'のダイレクトアタックで勝利！');
  }
  G_popupSourceUid=null;
  G.sel=null; render(); updateBtns();
}
/* ══ ブレイク数計算（共通） ══
   シングル=1 / W=2 / T=3 / Q=4 / パワード=パワー÷6000 / ワールド=全部 / G=全部+自分全部
*/
/* ══ ブレイク数計算（複数ブレイカー能力対応）
   総合ルール509.2c：複数のブレイカー能力を持つ場合、
   プレイヤーがどの能力を使うかを選択できる。
   ただし最小（1枚）を選ぶことはできない。
   戻り値：能力候補の配列 [{count, type}, ...]
   候補が1つなら即決定、複数なら選択ポップアップへ
══ */
function calcBreakOptions(c, shieldCount){
  var eff = c.eff || '';
  var pow = c.pow || 0;
  var options = [];

  if(eff.indexOf('G・ブレイカー')!==-1)       options.push({count: shieldCount, type:'g'});
  if(eff.indexOf('ワールド・ブレイカー')!==-1) options.push({count: shieldCount, type:'world'});
  if(eff.indexOf('Q・ブレイカー')!==-1)        options.push({count: 4,           type:'q'});
  if(eff.indexOf('T・ブレイカー')!==-1)        options.push({count: 3,           type:'t'});
  if(eff.indexOf('W・ブレイカー')!==-1)        options.push({count: 2,           type:'w'});
  if(eff.indexOf('パワード・ブレイカー')!==-1) options.push({count: Math.max(1, Math.floor(pow/6000)), type:'powered'});

  // 能力なしはシングル（1枚）
  if(options.length === 0) return [{count: 1, type:'single'}];

  // 重複除去（同じcountのものは最初の1つだけ残す）
  var seen = {};
  options = options.filter(function(o){
    if(seen[o.count]) return false;
    seen[o.count] = true;
    return true;
  });

  // 509.2c：1枚以下を選ぶことはできない（最低でも最小の能力を使う）
  // ただし最大の能力より小さい能力は選択肢として残す
  return options;
}

// 後方互換：単一の結果が欲しい場合（最大のものを返す）
function calcBreakCount(c, shieldCount){
  var options = calcBreakOptions(c, shieldCount);
  return options.reduce(function(max, o){ return o.count > max.count ? o : max; }, options[0]);
}
var BREAKER_LABEL = {single:'シングルブレイカー', w:'W・ブレイカー', t:'T・ブレイカー', q:'Q・ブレイカー', powered:'パワード・ブレイカー', world:'ワールド・ブレイカー', g:'G・ブレイカー'};
/* ══ シールドブレイク統合処理 ══
   _doBreakOne(idx)              : シールド1枚を即割る（内部用）
   breakShields(intactIdxs, needed) : 枚数に応じて即割る or 選択ポップアップ
     needed=1 → 即割る（ポップアップなし）
     needed>=2 → 選択ポップアップ
*/
function _doBreakOne(idx){
  var sh=G.oppShields[idx];
  if(!sh||!sh.intact) return;
  G.oppShields[idx].intact=false;
  var rem=0; for(var i=0;i<G.oppShields.length;i++) if(G.oppShields[i].intact) rem++;
  G.oppHand.push({id:sh.card.id,name:sh.card.name,cost:sh.card.cost,pow:sh.card.pow,type:sh.card.type,civ:sh.card.civ,icon:sh.card.icon,eff:sh.card.eff,uid:nuid(),twin:sh.card.twin||false,spellName:sh.card.spellName||'',spellCost:sh.card.spellCost||0,spellEff:sh.card.spellEff||''});
  log('a','💥 シールド'+(idx+1)+'をブレイク「'+sh.card.name+'」（相手残'+rem+'）');
  shakeShield('osh',idx); fxFloat('ブレイク！','#ff8844');
  // S・トリガー
  if(sh.card.eff&&sh.card.eff.indexOf('S・トリガー')!==-1){
    log('w','🛡 S・トリガー「'+sh.card.name+'」発動！');
    spellEff(sh.card,true);
  }
  // G・ストライク
  if(sh.card.eff&&sh.card.eff.indexOf('G・ストライク')!==-1&&G.oppBattle.length>0){
    var gsOpts=G.oppBattle.map(function(x){return{label:x.name+'（P:'+x.pow+'）',cls:''};});
    gsOpts.push({label:'✋ G・ストライクを使わない',cls:'no'});
    showPopup('G・ストライク！','「'+sh.card.name+'」\n相手クリーチャーを1体選ぶ。\nこのターン攻撃不可にする。',gsOpts,function(gi){
      if(gi===gsOpts.length-1){log('w','🛡 G・ストライク：使わない');return;}
      G.oppBattle[gi].tapped=true;
      log('w','🛡 G・ストライク：「'+G.oppBattle[gi].name+'」このターン攻撃不可！');
    });
  }
}

function breakShields(intactIdxs, needed, forceSelect){
  var actual=Math.min(needed, intactIdxs.length);
  // 1枚かつforceSelectなしなら即割る
  if(actual===1 && !forceSelect){
    _doBreakOne(intactIdxs[0]);
    var rem=0; for(var i=0;i<G.oppShields.length;i++) if(G.oppShields[i].intact) rem++;
    if(rem===0) log('a','🔥 全シールド破壊！次でダイレクト！');
    render(); updateBtns();
    return;
  }
  // 2枚以上 or forceSelect=true は選択ポップアップ
  var selected=[];
  document.getElementById('eff-title').textContent='シールドを'+actual+'枚選んで割る';
  document.getElementById('eff-desc').textContent='クリックして選択（'+actual+'枚）→ 決定';
  var btns=document.getElementById('eff-btns');
  btns.innerHTML='';
  var shWrap=document.createElement('div');
  shWrap.style.cssText='display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;';
  intactIdxs.forEach(function(idx){
    var b=document.createElement('button');
    b.className='eff-btn';
    b.style.cssText='width:64px;height:88px;padding:0;overflow:hidden;border-radius:6px;position:relative;';
    if(CARD_IMAGES['cardback']){
      b.innerHTML='<img src="'+CARD_IMAGES['cardback']+'" style="width:100%;height:100%;object-fit:cover;"><div style="position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:.5rem;color:#fff;background:rgba(0,0,0,.5);">No.'+(idx+1)+'</div>';
    } else {
      b.textContent='🛡 '+(idx+1);
    }
    (function(i){
      b.onclick=function(){
        var pos=selected.indexOf(i);
        if(pos>=0){
          selected.splice(pos,1);
          b.style.boxShadow=''; b.style.transform=''; b.style.borderColor='';
        } else if(selected.length<actual){
          selected.push(i);
          b.style.boxShadow='0 0 12px rgba(255,204,0,.8)';
          b.style.transform='translateY(-6px) scale(1.08)';
          b.style.borderColor='var(--gold)';
        }
        document.getElementById('eff-confirm').disabled=(selected.length!==actual);
      };
    })(idx);
    shWrap.appendChild(b);
  });
  btns.appendChild(shWrap);
  var confirmBtn=document.getElementById('eff-confirm');
  confirmBtn.disabled=true;
  confirmBtn.textContent='✅ 決定（'+actual+'枚ブレイク）';
  G_effPopupSelected='shield';
  G_effPopupCallback=function(){
    confirmBtn.textContent='✅ 決定';
    selected.forEach(function(idx){ _doBreakOne(idx); });
    var rem=0; for(var i=0;i<G.oppShields.length;i++) if(G.oppShields[i].intact) rem++;
    if(rem===0) log('a','🔥 全シールド破壊！次でダイレクト！');
    render(); updateBtns();
  };
  G_popupWaiting=true;
  document.getElementById('eff-popup').className='open';
}

function battle(atk,def,isMe){
  // スレイヤー判定：スレイヤー持ちは勝敗に関わらず相手を破壊
  var atkSlayer = (atk.eff && atk.eff.indexOf('スレイヤー')!==-1);
  var defSlayer = (def.eff && def.eff.indexOf('スレイヤー')!==-1);

  if(atk.pow>def.pow){
    if(isMe){
      
      G.oppBattle=G.oppBattle.filter(function(x){return x.uid!==def.uid;});G.oppGrave.push(def);log('w','✅「'+def.name+'」撃破！');fxFloat('勝利！','#ffcc00');
      if(defSlayer){G.myBattle=G.myBattle.filter(function(x){return x.uid!==atk.uid;});G.grave.push(atk);log('l','💀 スレイヤー：「'+atk.name+'」も破壊された');}
    } else {
      
      G.myBattle=G.myBattle.filter(function(x){return x.uid!==def.uid;});G.grave.push(def);log('l','💀「'+def.name+'」破壊された');
      if(defSlayer){G.oppBattle=G.oppBattle.filter(function(x){return x.uid!==atk.uid;});G.oppGrave.push(atk);log('w','⚡ スレイヤー：「'+atk.name+'」も破壊');}
    }
  } else if(atk.pow===def.pow){
    if(isMe){G.oppBattle=G.oppBattle.filter(function(x){return x.uid!==def.uid;});G.myBattle=G.myBattle.filter(function(x){return x.uid!==atk.uid;});G.oppGrave.push(def);G.grave.push(atk);}
    else{G.oppBattle=G.oppBattle.filter(function(x){return x.uid!==atk.uid;});G.myBattle=G.myBattle.filter(function(x){return x.uid!==def.uid;});G.oppGrave.push(atk);G.grave.push(def);}
    log('s','⚡ 相打ち！'); fxFloat('相打ち','#ffaa44');
  } else {
    if(isMe){
      
      G.myBattle=G.myBattle.filter(function(x){return x.uid!==atk.uid;});G.grave.push(atk);log('l','💀「'+atk.name+'」が破壊された！');fxFloat('敗北','#ff4422');
      if(atkSlayer){G.oppBattle=G.oppBattle.filter(function(x){return x.uid!==def.uid;});G.oppGrave.push(def);log('w','⚡ スレイヤー：「'+def.name+'」も道連れ！');}
    } else {
      
      G.oppBattle=G.oppBattle.filter(function(x){return x.uid!==atk.uid;});G.oppGrave.push(atk);G.myBattle=G.myBattle.filter(function(x){return x.uid!==def.uid;});G.grave.push(def);
      if(atkSlayer){log('l','💀 スレイヤー：「'+atk.name+'」は道連れで破壊');}
    }
  }
}

/* ══ 常在効果の適用 ══
   render()のたびに呼ばれ、場のカードのonPermanentを全部実行する。
   新しい常在付与カードはCARD_EFFECTSにonPermanentを追加するだけでOK。
*/
function applyPermanentEffects(){
  // grantedAbilitiesとpowをリセット
  for(var i=0; i<G.myBattle.length; i++){
    G.myBattle[i].grantedAbilities=[];
    G.myBattle[i].pow = G.myBattle[i].basePow; // パワーを基準値に戻す
  }
  for(var i=0; i<G.oppBattle.length; i++){
    G.oppBattle[i].grantedAbilities=[];
    G.oppBattle[i].pow = G.oppBattle[i].basePow;
  }
  // 場のカードのonPermanentを実行
  for(var i=0; i<G.myBattle.length; i++){
    var eff=CARD_EFFECTS[G.myBattle[i].id];
    if(eff && eff.onPermanent) eff.onPermanent(G.myBattle[i]);
  }
}

function canCardAttack(c){
  if(c.tapped||c.sealed) return false;
  var isMach=hasAbility(c,'マッハファイター')&&c.summoned;
  var isSA=hasAbility(c,'スピードアタッカー');
  var isAR=!!c.abyssRush;
  // アビスラッシュはプレイヤーのみ攻撃可
  if(isAR){
    var intactShields=G.oppShields.filter(function(x){return x.intact;});
    return intactShields.length>=0; // シールド0枚でもダイレクト攻撃可
  }
  if(c.summoned&&!isMach&&!isSA) return false;
  if(c.summoned&&isMach&&G.oppBattle.length===0) return false;
  var tappedEnemies=G.oppBattle.filter(function(x){return x.tapped;});
  var attackableEnemies=isMach?G.oppBattle:tappedEnemies;
  var canAttackShield=!c.summoned||(isSA&&!isMach);
  return attackableEnemies.length>0||canAttackShield;
}

function showCardActionPopup(c, cardEl, onClose){
  var pop=document.getElementById('card-action-popup');
  if(!pop) return;
  if(isLocked()) return;
  pop.innerHTML='';
  G_popupOnClose=onClose||null;

  var avNow=G_testMode?999:0;
  if(!G_testMode) for(var k=0;k<G.myMana.length;k++) if(!G.myMana[k].tapped) avNow++;
  var ecC=G_testMode?0:Math.max(G.costBonus>0?1:0,c.cost-G.costBonus);
  var ecS=G_testMode?0:Math.max(0,(c.spellCost||0)-G.costBonus);
  var canC=G_testMode||(avNow>=ecC);
  var canS=c.twin&&(G_testMode||(avNow>=ecS));

  function makeBtn(text,cls,fn){
    var b=document.createElement('button');
    b.className='cact-btn '+cls;
    b.textContent=text;
    b.onmouseenter=function(){clearTimeout(pop._closeTimer);};
    b.onclick=function(e){e.stopPropagation();hideCardActionPopup();fn();};
    return b;
  }

  if(G.phase===2&&!G.charged){
    pop.appendChild(makeBtn('🌿 チャージ','cact-mna',function(){
      chargeCardDirect(c);
    }));
  } else if(G.phase===3){
    if(c.twin&&canC){
      pop.appendChild(makeBtn('▶ プレイ（'+ecC+'）','cact-sum',function(){
        playCardDirect(c,false,ecC);
      }));
    }
    if(c.twin&&canS){
      pop.appendChild(makeBtn('💫 呪文（'+ecS+'）','cact-spell',function(){
        playCardDirect(c,true,ecS);
      }));
    }
    if(!c.twin&&c.type==='creature'&&canC){
      pop.appendChild(makeBtn('▶ プレイ（'+ecC+'）','cact-sum',function(){
        playCardDirect(c,false,ecC);
      }));
    }
    if(!c.twin&&c.type==='spell'&&canC){
      pop.appendChild(makeBtn('▶ プレイ（'+ecC+'）','cact-spell',function(){
        playCardDirect(c,false,ecC);
      }));
    }
  }

  if(pop.children.length===0) return;

  var rect=cardEl.getBoundingClientRect();
  var pw=96;
  var left=rect.left+rect.width/2-pw/2;
  if(left<4) left=4;
  if(left+pw>window.innerWidth-4) left=window.innerWidth-pw-4;
  pop.style.left=left+'px';
  pop.style.bottom=(window.innerHeight-rect.top+8)+'px';
  pop.style.width=pw+'px';
  pop.className='open';

  pop.onmouseleave=function(e){
    if(cardEl.contains(e.relatedTarget)) return;
    hideCardActionPopup();
  };
}

function bindDoubleTap(el, fn){
  // PCはダブルクリック、モバイルはシングルタップで詳細表示
  var lastTap=0;
  el.addEventListener('touchend',function(e){
    var now=Date.now();
    var dt=now-lastTap;
    lastTap=now;
    if(dt<350 && dt>30){
      e.preventDefault();
      fn(e);
    }
  },{passive:false});
  el.ondblclick=fn;
}

/* ══ エフェクト関数群 ══
   enterFx : バトルゾーンに出る（召喚・メクレイド・踏み倒し全部）→ 白グロー
   spellFx : 呪文を唱える → 青グロー＋波紋リング
   graveFx : 墓地から出る・唱える → 紫グロー＋紫リング
   playFx  : 後方互換ラッパー（fxType:'creature'→enterFx / 'spell'→spellFx）
*/
function _doFx(c, callback, fxClass, defaultIcon){
  var fx=document.getElementById('summon-fx');
  var img=document.getElementById('summon-fx-img');
  var icon=document.getElementById('summon-fx-icon');
  if(!fx){ if(callback) callback(); return; }
  fx.className='';
  if(CARD_IMAGES[c.id]){
    img.src=CARD_IMAGES[c.id];
    img.style.display='block';
    icon.style.display='none';
  } else {
    img.style.display='none';
    icon.textContent=c.icon||defaultIcon;
    icon.style.display='block';
  }
  void fx.offsetWidth;
  fx.className='active '+(fxClass||'');
  G_fxRunning = true;
  var finished = false;
  function onEnd(e){
    if(e && e.target !== fx) return; // 子要素のアニメーション終了は無視
    if(finished) return;
    finished = true;
    fx.removeEventListener('animationend',onEnd);
    fx.className='';
    G_fxRunning = false;
    if(callback) callback();
  }
  fx.addEventListener('animationend',onEnd);
  // フォールバック：1秒経っても発火しなければ強制完了
  setTimeout(function(){ onEnd(null); }, 1000);
}
function enterFx(c, callback){ _doFx(c, callback, '',      '⚔️'); }
function spellFx(c, callback){ _doFx(c, callback, 'spell', '💫'); }
function graveFx(c, callback){ _doFx(c, callback, 'grave', '🌑'); }

/* ドローFx：山札からカードが手元に飛んでくる */
function drawFx(card, callback){
  var cb = callback || function(){};
  var el = document.getElementById('draw-fx-card');
  if(!el){ cb(); return; }

  el.className='';
  el.innerHTML='';
  if(card && CARD_IMAGES[card.id]){
    var img = document.createElement('img');
    img.src = CARD_IMAGES[card.id];
    img.alt = card.name;
    el.appendChild(img);
  } else {
    el.textContent = (card && card.icon) || '🃏';
  }

  void el.offsetWidth;
  el.className = 'slide-in';

  var inDone = false;
  function onInEnd(e){
    if(e.target !== el) return;
    if(inDone) return;
    inDone = true;
    el.removeEventListener('animationend', onInEnd);
    void el.offsetWidth;
    el.className = 'slide-out';
    function onOutEnd(e2){
      if(e2.target !== el) return;
      el.removeEventListener('animationend', onOutEnd);
      el.className=''; el.innerHTML='';
      cb();
    }
    el.addEventListener('animationend', onOutEnd);
    setTimeout(function(){ el.className=''; el.innerHTML=''; cb(); }, 500);
  }
  el.addEventListener('animationend', onInEnd);
  setTimeout(function(){
    if(!inDone){ inDone=true; el.className=''; el.innerHTML=''; cb(); }
  }, 500);
}

/* ハンデスFx：カードが中央に出て墓地へ吸い込まれる
   card : 捨てられるカード
   who  : 'my'=自分が捨てる / 'opp'=相手が捨てる
   callback : アニメーション完了後のコールバック
*/
function discardFx(card, who, callback){
  var cb = callback || function(){};
  var el = document.getElementById('discard-fx-card');
  if(!el){ cb(); return; }

  // カード内容をセット
  el.className='';
  el.innerHTML='';
  if(CARD_IMAGES[card.id]){
    var img = document.createElement('img');
    img.src = CARD_IMAGES[card.id];
    img.alt = card.name;
    el.appendChild(img);
  } else {
    el.textContent = card.icon || '🃏';
  }

  // 出現アニメーション
  void el.offsetWidth;
  el.className = 'appear';

  // 出現完了後に吸い込みアニメーション
  var suckClass = (who==='my') ? 'suck-my' : 'suck-opp';
  var appearDone = false;
  function onAppearEnd(e){
    if(e.target !== el) return;
    if(appearDone) return;
    appearDone = true;
    el.removeEventListener('animationend', onAppearEnd);
    void el.offsetWidth;
    el.className = suckClass;
    function onSuckEnd(e2){
      if(e2.target !== el) return;
      el.removeEventListener('animationend', onSuckEnd);
      el.className='';
      el.innerHTML='';
      cb();
    }
    el.addEventListener('animationend', onSuckEnd);
    // フォールバック
    setTimeout(function(){
      el.className=''; el.innerHTML=''; cb();
    }, 600);
  }
  el.addEventListener('animationend', onAppearEnd);
  // フォールバック
  setTimeout(function(){
    if(!appearDone){ appearDone=true; el.className=''; el.innerHTML=''; cb(); }
  }, 600);
}

/* 後方互換ラッパー */
function playFx(c, callback, fxType){
  var isSpell=(fxType==='spell')||(c.type==='spell'&&fxType!=='creature');
  if(isSpell) spellFx(c,callback);
  else enterFx(c,callback);
}



function flashCard(uid, callback){
  requestAnimationFrame(function(){
    var el=document.querySelector('[data-uid="'+uid+'"]');
    if(!el){ if(callback) callback(); return; }
    el.classList.remove('flash-once');
    void el.offsetWidth;
    el.classList.add('flash-once');
    var container=document.createElement('div');
    container.className='ripple-container';
    for(var i=0;i<3;i++){
      var ring=document.createElement('div');
      ring.className='ripple-ring';
      container.appendChild(ring);
    }
    el.style.position='relative';
    el.appendChild(container);
    // 最後のリングのアニメーション終了後にコールバック
    var lastRing=container.children[container.children.length-1];
    function onRippleEnd(){
      lastRing.removeEventListener('animationend', onRippleEnd);
      if(container.parentNode) container.parentNode.removeChild(container);
      if(callback) callback();
    }
    lastRing.addEventListener('animationend', onRippleEnd);
  });
}

  }, delay);
}

function closeFieldViewModal(){
  // ポップアップを元に戻す
  for(var i=0;i<G_fieldViewPrevPopups.length;i++){
    var el=document.getElementById(G_fieldViewPrevPopups[i].id);
    if(el) el.className=G_fieldViewPrevPopups[i].cls;
  }
  G_fieldViewPrevPopups=[];
  // pbtnを再有効化
  var pbtn=document.getElementById('pbtn');
  if(pbtn) pbtn.disabled=false;
  // 戻るボタンを完全に隠す
  var btn=document.getElementById('field-view-btn');
  btn.className='';
  btn.style.display='none';
}
function toggleLogModal(){
  var modal=document.getElementById('log-modal');
  if(!modal) return;
  if(modal.className==='open'){
    closeLogModal();
  } else {
    modal.className='open';
    var fvBtn=document.getElementById('field-view-btn');
    if(fvBtn&&fvBtn.className==='open'){fvBtn.dataset.hidden='1';fvBtn.style.visibility='hidden';}
    G_logCount=0;
    var badge=document.getElementById('log-badge');
    if(badge){badge.textContent='';badge.style.display='none';}
    var list=document.getElementById('g-loglist');
    if(list) setTimeout(function(){list.scrollTop=list.scrollHeight;},50);
  }
}
function closeLogModal(){
  var modal=document.getElementById('log-modal');
  if(modal) modal.className='';
  var fvBtn=document.getElementById('field-view-btn');
  if(fvBtn&&fvBtn.className==='open'){fvBtn.dataset.hidden='';fvBtn.style.visibility='visible';}
}
function toggleLog(){toggleLogModal();}  // 後方互換

/* ══ エフェクト ══ */
function fxFlash(){var e=document.createElement('div');e.className='fxfl';document.body.appendChild(e);setTimeout(function(){e.parentNode&&e.parentNode.removeChild(e);},450);}
function fxFloat(t,col){var e=document.createElement('div');e.className='fxft';e.textContent=t;e.style.color=col;e.style.left=Math.max(0,window.innerWidth/2-60)+'px';e.style.top=Math.max(0,window.innerHeight/2-30)+'px';document.body.appendChild(e);setTimeout(function(){e.parentNode&&e.parentNode.removeChild(e);},1300);}
function setPhase(t){
  var gp=document.getElementById('g-phase'); if(gp) gp.textContent=t;
  var cp=document.getElementById('center-phase'); if(cp) cp.textContent=t;
}
function setPBtn(t){
  var pbtn=document.getElementById('pbtn');
  if(pbtn) pbtn.textContent=t;
}

/* ══ 起動時：cards.jsonを読み込んでからタイトル表示 ══ */
document.addEventListener('DOMContentLoaded', function(){
  // ローディング表示
  var titleEl = document.getElementById('scr-title');
  if(titleEl) titleEl.className = '';
  var loadMsg = document.createElement('div');
  loadMsg.id = 'load-msg';
  loadMsg.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#06060f;color:#ffcc00;font-size:.9rem;font-family:"Noto Sans JP",sans-serif;z-index:9999;';
  loadMsg.textContent = 'カードデータを読み込み中...';
  document.body.appendChild(loadMsg);

  loadCardsJson(function(){
    // 読み込み完了→ローディング非表示・タイトル表示
    var msg = document.getElementById('load-msg');
    if(msg) msg.parentNode.removeChild(msg);
    if(titleEl) titleEl.className = 'on';
    renderVersionBadge();
  });
});
</script>
